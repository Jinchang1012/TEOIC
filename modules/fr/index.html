<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4EE">
<title>法文訓練場</title>
<style>
:root{
  --paper:#F5F4EE; --card:#FFFFFF; --line:#E3E1D4; --line-soft:#EDEBDF;
  --ink:#1C2B23; --ink-soft:#5C6B60; --ink-faint:#939C92;
  --pine:#24513B; --pine-deep:#16352A; --pine-tint:#E9F0E9; --pine-mid:#3E7157;
  --brass:#A87B24; --brass-tint:#F7F0DC; --brass-line:#E3D5AC;
  --clay:#B0492A; --clay-tint:#F8EAE3; --clay-line:#E5C4B4;
  --radius:14px;
  --sans:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,details summary:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}
#app{max-width:760px;margin:0 auto;padding:22px 16px 90px}

/* ── 頂部 ── */
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--ink-faint);font-weight:600}
.masthead h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:.01em}

/* ── 分頁 ── */
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;padding:10px 8px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-soft);white-space:nowrap;min-width:64px}
.tabs button.on{background:var(--pine-deep);color:#fff}
.tabs button .n{display:inline-block;margin-left:4px;font-size:11px;font-variant-numeric:tabular-nums;opacity:.75}
.tabs button .tab-ic{display:none}
.tabs button .tab-tx{display:inline}

/* ── 通用 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.lbl{font-size:12px;letter-spacing:.26em;color:var(--ink-faint);font-weight:700;margin-bottom:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink-soft)}
.fchip.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
.voicesel{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink-soft);max-width:150px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:12px;font-size:15px;font-weight:700}
.btn.primary{background:var(--pine);color:#fff}
.btn.primary:hover{background:var(--pine-deep)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink-soft);background:var(--card)}
.btn.ghost:hover{border-color:var(--ink-faint)}
.btn.small{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.tagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pine-tint);color:var(--pine)}
.tag.diff{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}
.tag.clay{background:var(--clay-tint);color:var(--clay)}
.tag.brass{background:var(--brass-tint);color:var(--brass)}
.empty{padding:36px 12px;text-align:center;color:var(--ink-faint)}
.hr{border:none;border-top:1px dashed var(--line);margin:16px 0}

/* ── 總覽 ── */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.catrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.catrow .nm{width:118px;flex:none;font-size:14px}
.catrow .bar{flex:1;height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.catrow .bar i{display:block;height:100%;border-radius:99px;background:var(--pine-mid)}
.catrow .bar i.low{background:var(--clay)} .catrow .bar i.mid{background:var(--brass)}
.catrow .pc{width:86px;flex:none;text-align:right;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.today-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.callout{background:var(--brass-tint);border:1px solid var(--brass-line);border-radius:12px;padding:12px 16px;font-size:14.5px;margin-top:12px}

/* ── 單字卡 ── */
.v-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.fc{perspective:1400px;height:380px;margin-bottom:14px}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;overflow-y:auto}
.face.back{transform:rotateY(180deg)}
.face .top{display:flex;justify-content:space-between;align-items:center}
.fc-word{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:.01em;text-align:center;margin:auto 0 4px;line-height:1.15;word-break:break-word}
.fc-pos{text-align:center;color:var(--ink-faint);font-style:italic;margin-bottom:auto}
.fc-hint{text-align:center;font-size:12.5px;color:var(--ink-faint);letter-spacing:.1em}
.fc-word-sm{font-family:var(--serif);font-size:22px;font-weight:600}
.fc-meaning{font-size:19px;font-weight:700;margin:10px 0 2px}
.fc-ex{font-family:var(--serif);font-size:16.5px;margin-top:10px;line-height:1.65}
.fc-ex b{color:var(--pine);font-weight:700}
.fc-exzh{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.fc-tip{margin-top:12px;background:var(--brass-tint);border:1px solid var(--brass-line);border-radius:10px;padding:9px 13px;font-size:13.5px}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grade button{padding:14px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.grade .g0:hover{border-color:var(--clay);color:var(--clay)}
.grade .g1:hover{border-color:var(--brass);color:var(--brass)}
.grade .g2:hover{border-color:var(--pine);color:var(--pine)}
.grade small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.starbtn{font-size:22px;line-height:1;color:var(--ink-faint)}
.starbtn.on{color:var(--brass)}
.speakbtn{font-size:17px;line-height:1;color:var(--ink-faint);background:none;border:none;padding:2px 4px;cursor:pointer;vertical-align:middle}
.speakbtn:hover{color:var(--pine)}
.boxdots{display:flex;gap:3px}
.boxdots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.boxdots i.f{background:var(--pine-mid)}

/* ── 測驗 ── */
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.q-sent{font-size:19.5px;line-height:1.75;font-weight:600;margin:10px 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:13px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:left;font-size:15.5px;transition:border-color .12s}
.opt:hover{border-color:var(--ink-faint)}
.opt .abc{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink-soft)}
.opt.correct{border-color:var(--pine);background:var(--pine-tint)}
.opt.correct .abc{background:var(--pine);border-color:var(--pine);color:#fff}
.opt.wrong{border-color:var(--clay);background:var(--clay-tint)}
.opt.wrong .abc{background:var(--clay);border-color:var(--clay);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--line)}
.opt.correct[disabled]:hover{border-color:var(--pine)} .opt.wrong[disabled]:hover{border-color:var(--clay)}
.verdict{font-size:16px;font-weight:800;margin:14px 0 4px}
.verdict.ok{color:var(--pine)} .verdict.no{color:var(--clay)}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.prog{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .2s}
.sum-score{text-align:center;padding:8px 0 2px}
.sum-score .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pine)}
.setup-note{font-size:13px;color:var(--ink-faint);margin-top:10px}

/* ── 收藏/錯題 ── */
.fav-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
.fav-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fav-meta .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.wordrow{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line-soft);flex-wrap:wrap}
.wordrow .w{font-family:var(--serif);font-weight:700;font-size:16.5px}
.wordrow .m{color:var(--ink-soft);font-size:14px}

/* ── 題庫 ── */
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;background:var(--card);color:var(--ink);resize:vertical}
.imp-msg{border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
.imp-msg.ok{background:var(--pine-tint);color:var(--pine-deep)}
.imp-msg.err{background:var(--clay-tint);color:var(--clay)}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:12px;background:var(--card)}
details summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--ink-soft)}
details[open] summary{margin-bottom:10px}
pre.schema{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;overflow-x:auto;line-height:1.5}
.bank-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line-soft);font-size:14px;gap:8px}
.bank-row .del{color:var(--clay);font-size:13px;font-weight:600;flex:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:560px){
  .masthead h1{font-size:26px}
  .q-sent{font-size:17.5px}
  .fc-word{font-size:36px}
  .catrow .nm{width:96px;font-size:13px}
}

/* ── 行動裝置 ── */
@media(max-width:640px){
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-size:16px}
  #app{max-width:100%;padding:14px 14px calc(72px + env(safe-area-inset-bottom))}
  .masthead{gap:8px;margin-bottom:14px}
  .eyebrow{font-size:9px}
  .masthead h1{font-size:22px}
  #accentbox .chiprow{flex-wrap:wrap}
  .voicesel{max-width:120px;font-size:12.5px}

  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;background:#fff;border:none;border-top:1px solid var(--line);
    border-radius:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));
    margin-bottom:0;overflow-x:visible;
  }
  .tabs button{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;padding:6px 2px;border-radius:10px;
    font-size:10.5px;font-weight:600;white-space:normal;
  }
  .tabs button.on{background:transparent;color:var(--pine-deep)}
  .tabs button .tab-ic{display:block;font-size:20px;line-height:1}
  .tabs button .tab-tx{display:flex;align-items:center;gap:2px;line-height:1.1}
  .tabs button .n{display:none}

  .card{padding:16px;margin-bottom:12px}
  .btn{width:100%;min-height:48px;font-size:16px}
  .opt{min-height:48px;padding:13px 14px;font-size:17px}
  .fchip{min-height:40px;display:inline-flex;align-items:center;white-space:nowrap;flex:0 0 auto}
  .chiprow{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .chiprow::-webkit-scrollbar{display:none}

  .fc{height:min(58vh,460px)}
  .fc-word{font-size:32px}
  .fc-word-sm{font-size:19px}
  .q-sent{font-size:18px}
}
</style>

/* ── 儲存層 ── */
function defaults(){ return {vsrs:{}, custom:{vocab:[],seq:1}, qstats:{}, history:{}}; }
let store = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(!s || typeof s!=='object') return defaults();
    const d = defaults();
    for(const k in d) if(!(k in s)) s[k]=d[k];
    if(!s.custom.seq) s.custom.seq=1;
    return s;
  }catch(e){ return defaults(); }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function today(){ return Math.floor(Date.now()/864e5); }
function streak(){
  let n=0, d=today();
  while(store.history[d]){ n++; d--; }
  return n;
}
function touchToday(){ store.history[today()]=true; }

function allV(){ return BUILTIN_VOCAB.concat(store.custom.vocab); }
function vsrs(id){ return store.vsrs[id] || (store.vsrs[id]={box:0,due:today(),seen:0,star:false}); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(c,a){ return a? Math.round(c/a*100) : null; }
const ABC = ['A','B','C','D'];

/* 確定性洗牌：用字串 seed 產生穩定亂數，避免同一題每次重render位置又變 */
function seededShuffle(arr, seedStr){
  let seed = 0;
  for(let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
  function rnd(){ seed = (seed*1103515245 + 12345) >>> 0; return seed / 4294967296; }
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ── 發音（瀏覽器內建 speechSynthesis，無外部資源） ── */
const SPEECH_OK = (typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined');
const ACCENT_KEY = 'francais_accent';
let ACCENT = 'fr';       // 'fr' = France, 'ca' = Canada
try{ const a = localStorage.getItem(ACCENT_KEY); if(a==='fr'||a==='ca') ACCENT=a; }catch(e){}
function setAccent(a){ ACCENT = (a==='ca') ? 'ca' : 'fr'; try{ localStorage.setItem(ACCENT_KEY, ACCENT); }catch(e){} render(); }
let _voices = [];
function _loadVoices(){ try{ _voices = speechSynthesis.getVoices()||[]; }catch(e){ _voices=[]; } }
function _onVoicesReady(){ _loadVoices(); _fillVoiceSel(); render(); }
if(SPEECH_OK){
  _loadVoices();
  if(typeof speechSynthesis.addEventListener==='function'){
    speechSynthesis.addEventListener('voiceschanged', _onVoicesReady);
  } else {
    speechSynthesis.onvoiceschanged = _onVoicesReady;
  }
}
function hasCAVoice(){ return _voices.some(v=>/^fr-CA/i.test(v.lang)); }
function _fillVoiceSel(){
  const sel = document.getElementById('voicesel');
  if(!sel) return;
  if(!SPEECH_OK || !_voices.length){ sel.style.display='none'; sel.innerHTML=''; return; }
  const frVoices = _voices.filter(v=>/^fr-/i.test(v.lang));
  if(!frVoices.length){ sel.style.display='none'; sel.innerHTML=''; return; }
  const cur = _savedVoiceName();
  const shortName = n => n.replace(/^Microsoft\s+/i,'').replace(/\s*-\s*(French.*|Fran[cç]ais.*)$/i,'').trim();
  const groups = {};
  frVoices.forEach(v=>{ (groups[v.lang]=groups[v.lang]||[]).push(v); });
  let html = '<option value="auto">自動（推薦）</option>';
  Object.keys(groups).sort().forEach(lang=>{
    html += '<optgroup label="'+esc(lang)+'">';
    groups[lang].forEach(v=>{
      html += '<option value="'+esc(v.name)+'" '+(cur===v.name?'selected':'')+'>'+esc(shortName(v.name))+'</option>';
    });
    html += '</optgroup>';
  });
  sel.innerHTML = html;
  sel.style.display = '';
  if(cur==='auto') sel.value='auto';
}
const VOICE_KEY = 'francais_voice';
function _savedVoiceName(){ try{ return localStorage.getItem(VOICE_KEY) || 'auto'; }catch(e){ return 'auto'; } }
function _scoreVoice(v){
  let s = 0;
  if(/Natural/i.test(v.name)) s += 100;
  if(/Neural/i.test(v.name)) s += 80;
  if(/Google/i.test(v.name)) s += 60;
  if(/Online/i.test(v.name)) s += 20;
  if(/Desktop/i.test(v.name)) s -= 50;
  if(v.localService===false) s += 10;
  return s;
}
function _bestOf(list){
  if(!list.length) return null;
  return list.slice().sort((a,b)=>_scoreVoice(b)-_scoreVoice(a))[0];
}
function _pickVoice(){
  if(!_voices || !_voices.length) _loadVoices();
  if(!_voices || !_voices.length) return null;
  const chosen = _savedVoiceName();
  if(chosen && chosen!=='auto'){
    const v = _voices.find(v=>v.name===chosen);
    if(v) return v;
  }
  const wantLang = ACCENT==='ca' ? 'fr-CA' : 'fr-FR';
  const sameAccent = _voices.filter(v=>v.lang===wantLang);
  if(sameAccent.length) return _bestOf(sameAccent);
  const anyFr = _voices.filter(v=>/^fr-/i.test(v.lang));
  return _bestOf(anyFr);
}
function speak(text){
  if(!SPEECH_OK || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = ACCENT==='ca' ? 'fr-CA' : 'fr-FR';
    u.rate = 0.92;
    const v = _pickVoice();
    if(v){ try{ u.voice = v; u.lang = v.lang; }catch(e){ /* 指派失敗就用預設聲照唸 */ } }
    speechSynthesis.speak(u);
  }catch(e){ /* 靜默失敗，不中斷 UI */ }
}

  }
  const w = allV().find(x=>x.id===V.queue[V.idx]);
  if(!w){ V.idx++; return rVocab(); }
  const s=vsrs(w.id);
  return chips+modeSel+`
    <div class="v-top" style="margin-bottom:8px">
      <span class="faint" style="font-variant-numeric:tabular-nums">第 ${V.done+1} 張 · 剩 ${V.queue.length-V.idx} 張</span>
      <span class="boxdots" title="熟練度（盒 ${s.box}/4）">${[0,1,2,3,4].map(i=>'<i class="'+(i<=s.box&&s.seen?'f':'')+'"></i>').join('')}</span>
    </div>
    ${fcHtml(w)}
    ${V.flip
      ? `<div class="grade">
          <button class="g0" data-act="vGrade" data-g="0">不熟<small>今天再出現</small></button>
          <button class="g1" data-act="vGrade" data-g="1">有點忘<small>明天再看</small></button>
          <button class="g2" data-act="vGrade" data-g="2">記得<small>隔 ${SRS_IV[Math.min(4,s.box+1)]} 天</small></button>
        </div>`
      : '<div style="text-align:center"><button class="btn primary" data-act="vFlip">翻面看解釋</button></div>'}
  `;
}
function fcHtml(w){
  const s=store.vsrs[w.id];
  const star = s&&s.star;
  const flip = ui.vocab.flip;
  const exHtml = (()=>{
    let h=esc(w.example);
    try{ const firstWord=w.word.split(/[\s(/]/)[0]; const re=new RegExp('\\b('+escReg(firstWord)+'\\w*)','i'); h=h.replace(re,'<b>$1</b>'); }catch(e){}
    return h;
  })();
  return `<div class="fc ${flip?'flip':''}">
    <div class="fc-inner">
      <button class="face" data-act="vFlip" aria-label="翻面">
        <div class="top"><span class="tag ${w.freq==='極高頻'?'brass':''}">${esc(w.freq)}</span>${SPEECH_OK?'<span class="speakbtn" data-act="speakWord" data-text="'+esc(w.word)+'" role="button" tabindex="0" aria-label="發音" title="發音">🔊</span>':''}<span class="starbtn ${star?'on':''}" data-act="vStar" data-id="${esc(w.id)}" role="button" tabindex="0" aria-label="收藏">${star?'★':'☆'}</span></div>
        <div class="fc-word">${esc(w.word)}</div>
        <div class="fc-pos">${esc(w.pos)}</div>
        <div class="fc-hint">點擊翻面</div>
      </button>
      <button class="face back" data-act="vFlip" aria-label="翻回">
        <div class="top"><span class="fc-word-sm">${esc(w.word)} <span class="fc-pos" style="font-size:14px">${esc(w.pos)}</span></span>${SPEECH_OK?'<span class="speakbtn" data-act="speakWord" data-text="'+esc(w.word)+'" role="button" tabindex="0" aria-label="發音" title="發音">🔊</span>':''}<span class="starbtn ${star?'on':''}" data-act="vStar" data-id="${esc(w.id)}" role="button" tabindex="0" aria-label="收藏">${star?'★':'☆'}</span></div>
        <div class="fc-meaning">${esc(w.meaning)}</div>
        <div class="fc-ex">${exHtml}${SPEECH_OK?'<span class="speakbtn" data-act="speakEx" data-text="'+esc(w.example)+'" role="button" tabindex="0" aria-label="唸例句" title="唸例句">🔊</span>':''}</div>
        <div class="fc-exzh">${esc(w.exampleZh)}</div>
        ${w.tip?'<div class="fc-tip">💡 '+esc(w.tip)+'</div>':''}
      </button>
    </div>
  </div>`;
}

/* ── 測驗（由 V_DATA 自動生成四選一） ── */
function buildQuiz(){
  const Q=ui.quiz;
  let pool = allV().filter(w=>Q.theme==='all'||w.theme===Q.theme);
  if(Q.src==='wrong') pool = pool.filter(w=>{const s=store.qstats[w.id]; return s&&s.lw;});
  if(pool.length<4){ Q.list=[]; return; }
  const picked = shuffle(pool).slice(0, Math.min(Q.count, pool.length));
  Q.list = picked.map((w,i)=>makeQuestion(w, pool, i));
  Q.idx=0; Q.picked=null; Q.session=[];
}
function makeQuestion(w, pool, seedIdx){
  const modes = ['fr2zh','zh2fr','blank'];
  const mode = Q_MODE_FIXED(seedIdx, w);
  let stem, correctText, distractorSrc;
  if(mode==='fr2zh'){
    stem = w.word;
    correctText = w.meaning;
    distractorSrc = pool.filter(x=>x.id!==w.id).map(x=>x.meaning);
  } else if(mode==='zh2fr'){
    stem = w.meaning;
    correctText = w.word;
    distractorSrc = pool.filter(x=>x.id!==w.id).map(x=>x.word);
  } else {
    // blank: 例句挖空
    const firstWord = w.word.split(/[\s(/]/)[0];
    let re;
    try{ re = new RegExp('\\b('+escReg(firstWord)+'\\w*)','i'); }catch(e){ re=null; }
    stem = re && re.test(w.example) ? w.example.replace(re,'______') : w.example.replace(firstWord,'______');
    correctText = w.word;
    distractorSrc = pool.filter(x=>x.id!==w.id).map(x=>x.word);
  }
  // 同主題優先干擾項
  const sameTheme = pool.filter(x=>x.id!==w.id && x.theme===w.theme);
  let distractPool = sameTheme.length>=3 ? sameTheme : pool.filter(x=>x.id!==w.id);
  let distractTexts = (mode==='zh2fr'||mode==='blank') ? distractPool.map(x=>x.word) : distractPool.map(x=>x.meaning);
  distractTexts = Array.from(new Set(distractTexts.filter(t=>t && t!==correctText)));
  const distractors = seededShuffle(distractTexts, w.id+'-d').slice(0,3);
  while(distractors.length<3){ distractors.push('（無適合干擾項）'); }
  const options = seededShuffle([correctText].concat(distractors), w.id+'-o');
  const answer = options.indexOf(correctText);
  return {id:w.id, wordId:w.id, mode, stem, options, answer, word:w};
}
function Q_MODE_FIXED(i, w){
  // 確定性分配題型：依 id 字元碼決定，讓同一單字每次生成同一題型
  let seed=0; for(let k=0;k<w.id.length;k++) seed += w.id.charCodeAt(k);
  const modes=['fr2zh','zh2fr','blank'];
  return modes[seed%3];
}
function rQuiz(){
  const Q=ui.quiz;
  if(Q.stage==='setup') return rQuizSetup();
  if(Q.stage==='run') return rQuizRun();
  return rQuizSummary();
}
function rQuizSetup(){
  const Q=ui.quiz;
  const themes=[{key:'all',name:'全部主題'}].concat(THEMES);
  return `
  <div class="card">
    <div class="lbl">選擇主題</div>
    <div class="chiprow">${themes.map(t=>'<button class="fchip '+(Q.theme===t.key?'on':'')+'" data-act="qTheme" data-t="'+t.key+'">'+t.name+'</button>').join('')}</div>
    <div class="hr"></div>
    <div class="lbl">題數</div>
    <div class="chiprow">${[10,15,20,30].map(n=>'<button class="fchip '+(Q.count===n?'on':'')+'" data-act="qCount" data-n="'+n+'">'+n+' 題</button>').join('')}</div>
    <div class="hr"></div>
    <div class="lbl">題型</div>
    <p class="muted" style="font-size:13.5px;margin:0">混合出題：法→中選義、中→法選字、例句填空，三種類型隨機交錯。</p>
    <div style="margin-top:18px"><button class="btn primary" data-act="qStart">開始測驗</button></div>
    <p class="setup-note">選項會用同主題單字當干擾項，答案位置以固定規則洗牌，避免集中在同一位置。</p>
  </div>`;
}
function rQuizRun(){
  const Q=ui.quiz;
  if(!Q.list.length) buildQuiz();
  if(!Q.list.length) return '<div class="card empty">此主題單字量不足以出題（至少需要 4 個），請換一個主題。<div style="margin-top:12px"><button class="btn ghost small" data-act="qBackSetup">回設定</button></div></div>';
  if(Q.idx>=Q.list.length){ Q.stage='summary'; return rQuizSummary(); }
  const q = Q.list[Q.idx];
  const modeLabel = {fr2zh:'法→中　選出正確中文意思', zh2fr:'中→法　選出正確法文單字', blank:'例句填空　選出正確單字'}[q.mode];
  const answered = Q.picked!=null;
  return `
  <div class="prog"><i style="width:${Math.round(Q.idx/Q.list.length*100)}%"></i></div>
  <div class="card">
    <div class="q-head"><span class="tag">${modeLabel}</span><span class="faint" style="font-size:13px">${Q.idx+1} / ${Q.list.length}</span></div>
    <div class="q-sent">${esc(q.stem)}</div>
    <div class="opts">
      ${q.options.map((opt,i)=>{
        let cls='opt';
        if(answered){
          if(i===q.answer) cls+=' correct';
          else if(i===Q.picked) cls+=' wrong';
          else cls+=' dim';
        }
        return '<button class="'+cls+'" data-act="qPick" data-i="'+i+'" '+(answered?'disabled':'')+'><span class="abc">'+ABC[i]+'</span><span>'+esc(opt)+'</span></button>';
      }).join('')}
    </div>
    ${answered ? `
      <div class="verdict ${Q.picked===q.answer?'ok':'no'}">${Q.picked===q.answer?'✅ 答對了':'❌ 答錯了'}</div>
      <div class="faint" style="font-size:14px">${esc(q.word.word)}　${esc(q.word.pos)}　${esc(q.word.meaning)}</div>
      <div class="fc-exzh" style="margin-top:4px">${esc(q.word.example)}（${esc(q.word.exampleZh)}）</div>
      <div class="q-foot">
        <span></span>
        <button class="btn primary small" data-act="qNext">${Q.idx+1>=Q.list.length?'查看結果':'下一題'}</button>
      </div>
    ` : ''}
  </div>`;
}
function rQuizSummary(){
  const Q=ui.quiz;
  const total=Q.session.length;
  const correct=Q.session.filter(s=>s.ok).length;
  return `
  <div class="card sum-score">
    <div class="lbl">測驗結果</div>
    <div class="big">${correct} / ${total}</div>
    <p class="muted">正確率 ${pct(correct,total)}%</p>
    <div class="today-acts" style="justify-content:center">
      <button class="btn primary small" data-act="qRestart">再測一次</button>
      <button class="btn ghost small" data-act="qBackSetup">換設定</button>
    </div>
  </div>`;
}

/* ── 收藏・錯題 ── */
function rFav(){
  const F=ui.fav;
  const vAll=allV();
  const starList = vAll.filter(w=>{const s=store.vsrs[w.id];return s&&s.star;});
  const wrongList = vAll.filter(w=>{const s=store.qstats[w.id]; return s&&s.lw;});
  const chips='<div class="chiprow" style="margin-bottom:14px">'+
    '<button class="fchip '+(F.filter==='star'?'on':'')+'" data-act="favFilter" data-f="star">收藏 ('+starList.length+')</button>'+
    '<button class="fchip '+(F.filter==='wrong'?'on':'')+'" data-act="favFilter" data-f="wrong">錯題本 ('+wrongList.length+')</button>'+
    '</div>';
  const list = F.filter==='star' ? starList : wrongList;
  if(!list.length) return chips+'<div class="card empty">'+(F.filter==='star'?'還沒有收藏的單字。到單字卡點 ☆ 收藏。':'還沒有錯題紀錄。做幾次測驗答錯後會出現在這裡。')+'</div>';
  return chips + list.map(w=>{
    const s=store.qstats[w.id];
    return `<div class="fav-item">
      <div class="fav-meta">
        <span class="tag">${esc(w.themeName||w.theme)}</span>
        <span class="tag diff">${esc(w.freq)}</span>
        <span class="sp">${SPEECH_OK?'<span class="speakbtn" data-act="speakWord" data-text="'+esc(w.word)+'" role="button" tabindex="0" aria-label="發音">🔊</span>':''}<span class="starbtn ${store.vsrs[w.id]&&store.vsrs[w.id].star?'on':''}" data-act="vStar" data-id="${esc(w.id)}" role="button" tabindex="0">${store.vsrs[w.id]&&store.vsrs[w.id].star?'★':'☆'}</span></span>
      </div>
      <div class="wordrow"><span class="w">${esc(w.word)}</span><span class="m">${esc(w.pos)}　${esc(w.meaning)}</span></div>
      <div class="fc-exzh">${esc(w.example)}（${esc(w.exampleZh)}）</div>
      ${s?'<div class="faint" style="font-size:12.5px;margin-top:6px">答對 '+s.c+' / 共 '+s.a+' 次</div>':''}
    </div>`;
  }).join('');
}

/* ── 題庫（自建單字匯入） ── */
function rBank(){
  const B=ui.bank;
  const customN = store.custom.vocab.length;
  return `
  <div class="card">
    <div class="lbl">內建單字庫</div>
    <p class="muted" style="font-size:14px">共 ${BUILTIN_VOCAB.length} 筆，涵蓋 ${THEMES.length} 個主題。${customN?('另有自建 '+customN+' 筆。'):''}</p>
  </div>
  <div class="card">
    <div class="lbl">匯入自建單字（JSON）</div>
    <p class="muted" style="font-size:13.5px">貼上符合格式的 JSON 陣列，會加進你的自建單字庫（不影響內建庫）。</p>
    <textarea id="imp-ta" placeholder='[{"word":"Bonjour","pos":"n.m.","meaning":"你好","example":"Bonjour !","exampleZh":"你好！","theme":"salut","freq":"高頻"}]'></textarea>
    <div style="margin-top:8px"><button class="btn primary small" data-act="impDo">匯入</button></div>
    <div id="imp-msg">${B.msg?('<div class="imp-msg '+(B.msg.ok?'ok':'err')+'">'+esc(B.msg.text)+'</div>'):''}</div>
    <details>
      <summary>欄位格式說明</summary>
      <pre class="schema">word (法文), pos (詞性), meaning (中文), example (法文例句),
exampleZh (例句中譯), theme (主題key，見下), freq (極高頻|高頻|中頻)
theme 可用值：${THEMES.map(t=>t.key).join(', ')}</pre>
    </details>
  </div>
  ${customN?`<div class="card">
    <div class="lbl">自建單字清單</div>
    ${store.custom.vocab.map(w=>'<div class="bank-row"><span>'+esc(w.word)+'　'+esc(w.meaning)+'</span><button class="del" data-act="bankDel" data-id="'+esc(w.id)+'">刪除</button></div>').join('')}
  </div>`:''}`;
}

/* =====================================================================
   動作
   ===================================================================== */
const ACTIONS = {
  nav(d){ ui.tab=d.tab; render(); },
  goVocab(){ ui.tab='vocab'; render(); },
  goVocabTheme(d){ ui.tab='vocab'; ui.vocab.theme=d.t; ui.vocab.mode='browse'; ui.vocab.browseIdx=0; render(); },
  goQuiz(){ ui.tab='quiz'; ui.quiz.stage='setup'; render(); },

  setAccent(d){ setAccent(d.a); },
  speakWord(d){ speak(d.text); },
  speakEx(d){ speak(d.text); },

  vTheme(d){ ui.vocab.theme=d.t; ui.vocab.browseIdx=0; buildVQueue(); render(); },
  vMode(d){ ui.vocab.mode=d.m; ui.vocab.flip=false; if(d.m==='due' && !ui.vocab.queue.length) buildVQueue(); render(); },
  vFlip(){ ui.vocab.flip=!ui.vocab.flip; render(); },
  vPrev(){ const list=vBrowseList(); ui.vocab.browseIdx=(ui.vocab.browseIdx-1+list.length)%list.length; ui.vocab.flip=false; render(); },
  vNext(){ const list=vBrowseList(); ui.vocab.browseIdx=(ui.vocab.browseIdx+1)%list.length; ui.vocab.flip=false; render(); },
  vRebuild(){ buildVQueue(); render(); },
  vStar(d){ const s=vsrs(d.id); s.star=!s.star; save(); render(); },
  vGrade(d){
    const V=ui.vocab, id=V.queue[V.idx], s=vsrs(id), g=+d.g;
    s.seen=(s.seen||0)+1;
    touchToday();
    if(g===0){ s.box=0; s.due=today(); }
    else if(g===1){ s.box=Math.max(0,s.box-1<0?0:Math.min(s.box,1)); s.due=today()+1; }
    else { s.box=Math.min(4,s.box+1); s.due=today()+SRS_IV[s.box]; }
    save();
    V.idx++; V.done++; V.flip=false;
    render();
  },

  qTheme(d){ ui.quiz.theme=d.t; render(); },
  qCount(d){ ui.quiz.count=+d.n; render(); },
  qStart(){ ui.quiz.stage='run'; buildQuiz(); render(); },
  qBackSetup(){ ui.quiz.stage='setup'; render(); },
  qRestart(){ ui.quiz.stage='run'; buildQuiz(); render(); },
  qPick(d){
    const Q=ui.quiz, q=Q.list[Q.idx];
    if(Q.picked!=null) return;
    Q.picked=+d.i;
    const ok = Q.picked===q.answer;
    Q.session.push({id:q.id, ok});
    const s = store.qstats[q.wordId] || (store.qstats[q.wordId]={a:0,c:0,lw:false});
    s.a++; if(ok){ s.c++; s.lw=false; } else { s.lw=true; }
    touchToday();
    save();
    render();
  },
  qNext(){ ui.quiz.idx++; ui.quiz.picked=null; render(); },

  favFilter(d){ ui.fav.filter=d.f; render(); },

  impDo(){
    const ta=document.getElementById('imp-ta');
    let data;
    try{ data=JSON.parse(ta.value); }catch(e){ ui.bank.msg={ok:false,text:'JSON 格式錯誤：'+e.message}; render(); return; }
    if(!Array.isArray(data)){ ui.bank.msg={ok:false,text:'必須是陣列'}; render(); return; }
    let n=0;
    data.forEach(it=>{
      if(!it.word||!it.meaning) return;
      const theme = THEMES.some(t=>t.key===it.theme)?it.theme:'quotidien';
      const freq = ['極高頻','高頻','中頻'].includes(it.freq)?it.freq:'中頻';
      store.custom.vocab.push({
        id:'f-c'+(store.custom.seq++), theme, themeName:(THEMES.find(t=>t.key===theme)||{}).name,
        word:it.word, pos:it.pos||'', meaning:it.meaning, example:it.example||'', exampleZh:it.exampleZh||'',
        collocations:[], freq, tip:it.tip||''
      });
      n++;
    });
    save();
    ui.bank.msg = n>0 ? {ok:true,text:'成功匯入 '+n+' 筆'} : {ok:false,text:'沒有符合格式的資料'};
    render();
  },
  bankDel(d){
    store.custom.vocab = store.custom.vocab.filter(w=>w.id!==d.id);
    save(); render();
  },

  expProg(){
    const blob = new Blob([JSON.stringify(store)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='francais-progress-'+today()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  impProgShow(){ ui.backupShow=true; render(); },
  impProgDo(){
    const ta=document.getElementById('bk-ta');
    try{
      const s=JSON.parse(ta.value);
      if(!s||typeof s!=='object') throw new Error('格式錯誤');
      store = Object.assign(defaults(), s);
      save();
      document.getElementById('bk-msg').innerHTML='<div class="imp-msg ok">匯入成功</div>';
      render();
    }catch(e){
      document.getElementById('bk-msg').innerHTML='<div class="imp-msg err">匯入失敗：'+esc(e.message)+'</div>';
    }
  },
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.act==='vStar'||el.dataset.act==='speakWord'||el.dataset.act==='speakEx') e.stopPropagation();
  const fn=ACTIONS[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el.dataset,el); }
},true);

const _voiceSelEl = document.getElementById('voicesel');
if(_voiceSelEl){
  _voiceSelEl.addEventListener('change', e=>{
    const val = e.target.value;
    try{ localStorage.setItem(VOICE_KEY, val); }catch(err){}
    speak('Ceci est un essai de voix.');
  });
}

_fillVoiceSel();
render();
</script>
