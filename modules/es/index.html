<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F2EC">
<title>西文訓練場</title>
<style>
:root{
  --paper:#F6F2EC; --card:#FFFFFF; --line:#E6DED2; --line-soft:#EFE9DF;
  --ink:#2B1F1B; --ink-soft:#6A5C55; --ink-faint:#9C9089;
  --pine:#8c3b2f; --pine-deep:#5e2219; --pine-tint:#F6E9E5; --pine-mid:#b25a4a;
  --brass:#A87B24; --brass-tint:#F7F0DC; --brass-line:#E3D5AC;
  --ok:#2f6b4f; --ok-tint:#E6F0EA;
  --clay:#C45A12; --clay-tint:#FBEBDD; --clay-line:#EBC9A8;
  --radius:14px;
  --sans:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,details summary:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}
#app{max-width:760px;margin:0 auto;padding:22px 16px 90px}

/* 頂部 */
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--ink-faint);font-weight:600}
.masthead h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:.01em}

/* 分頁 */
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;padding:10px 8px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-soft);white-space:nowrap;min-width:64px}
.tabs button.on{background:var(--pine-deep);color:#fff}
.tabs button .n{display:inline-block;margin-left:4px;font-size:11px;font-variant-numeric:tabular-nums;opacity:.75}
.tabs button .tab-ic{display:none}
.tabs button .tab-tx{display:inline}

/* 通用 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.lbl{font-size:12px;letter-spacing:.26em;color:var(--ink-faint);font-weight:700;margin-bottom:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink-soft)}
.fchip.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
.voicesel{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink-soft);max-width:150px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none}
.btn.primary{background:var(--pine);color:#fff}
.btn.primary:hover{background:var(--pine-deep)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink-soft);background:var(--card)}
.btn.ghost:hover{border-color:var(--ink-faint)}
.btn.small{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.tagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pine-tint);color:var(--pine)}
.tag.diff{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}
.tag.clay{background:var(--clay-tint);color:var(--clay)}
.tag.brass{background:var(--brass-tint);color:var(--brass)}
.empty{padding:36px 12px;text-align:center;color:var(--ink-faint)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.callout{background:var(--brass-tint);border:1px solid var(--brass-line);border-radius:12px;padding:12px 16px;font-size:14.5px;margin-top:12px}

/* 總覽 */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.catrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.catrow .nm{width:138px;flex:none;font-size:14px}
.catrow .bar{flex:1;height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden;position:relative}
.catrow .bar i{display:block;height:100%;border-radius:99px;background:var(--pine-mid)}
.catrow .pc{width:96px;flex:none;text-align:right;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* 情境包卡 */
.packcard{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.packcard:hover{border-color:var(--pine-mid)}
.packcard h3{margin:6px 0 4px;font-size:17px}
.packcard .intro{font-size:13.5px;color:var(--ink-soft);margin:2px 0 8px}
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin:6px 0 4px}
.seg button{flex:1;padding:11px 6px;font-size:14.5px;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--pine);color:#fff}

/* 作答 */
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13.5px;color:var(--ink-soft)}
.prog{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .2s}
.q-scene{font-size:12.5px;color:var(--ink-faint);letter-spacing:.06em}
.q-zh{font-size:24px;font-weight:800;line-height:1.5;margin:6px 0 4px;display:flex;gap:10px;align-items:flex-start}
.speakbtn{font-size:18px;line-height:1;color:var(--ink-faint);padding:4px 6px;border-radius:8px}
.speakbtn:hover{color:var(--pine)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:center;gap:13px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:left;font-size:16px;font-family:var(--serif);transition:border-color .12s}
.opt:hover{border-color:var(--ink-faint)}
.opt .abc{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink-soft);font-family:var(--sans)}
.opt.correct{border-color:var(--ok);background:var(--ok-tint)}
.opt.correct .abc{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--clay);background:var(--clay-tint)}
.opt.wrong .abc{background:var(--clay);border-color:var(--clay);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.ansrow{min-height:54px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;background:var(--paper)}
.ansrow.ok{border-color:var(--ok);background:var(--ok-tint)}
.ansrow.bad{border-color:var(--clay);background:var(--clay-tint)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:48px}
.tile{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-family:var(--serif);font-size:17px;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--pine-mid)}
.tile.used{visibility:hidden}
.tile[disabled]{cursor:default}
.hint-empty{color:var(--ink-faint);font-size:13.5px;padding:6px 4px}
input.typein{width:100%;margin-top:14px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:18px;font-family:var(--serif);background:var(--card);color:var(--ink)}
.typeopts{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-size:17px;font-weight:800;margin:0 0 8px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--clay)}
.stdans{font-family:var(--serif);font-size:19px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.altlist{font-size:14px;color:var(--ink-soft);margin:6px 0 0;padding-left:18px}
.altlist li{font-family:var(--serif)}
.why{background:var(--clay-tint);border:1px solid var(--clay-line);border-radius:10px;padding:9px 13px;font-size:14px;margin:10px 0}
.chunks{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0;font-size:14.5px}
.chunks div{padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.chunks .h{background:var(--paper);font-size:12px;letter-spacing:.12em;color:var(--ink-faint);font-weight:700}
.chunks .es{font-family:var(--serif);font-weight:600}
.chunks div:nth-last-child(-n+2){border-bottom:none}
.note{background:var(--brass-tint);border:1px solid var(--brass-line);border-radius:10px;padding:9px 13px;font-size:13.8px;margin:10px 0}
.optexp{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.optexp li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--card);overflow-wrap:anywhere}
.optexp .oe-es{font-family:var(--serif);font-weight:600;font-size:15px}
.optexp .oe-why{color:var(--ink-soft);margin-top:2px}
.optexp .oe-mark{display:inline-block;min-width:1.4em;font-weight:800}
.optexp li.right{border-color:var(--ok)}
.optexp li.right .oe-mark{color:var(--ok)}
.optexp li.picked{border-color:var(--clay);background:var(--clay-tint)}
.optexp li.picked .oe-mark{color:var(--clay)}
.grammar{margin:10px 0;display:grid;gap:5px;font-size:14px}
.grammar div{overflow-wrap:anywhere}
.grammar .gtag{display:inline-block;background:var(--brass-tint);border:1px solid var(--brass-line);border-radius:6px;padding:0 7px;margin-right:6px;font-size:12.5px;font-weight:700}
.gpanel{margin:14px 0 0;border:1px solid var(--brass-line);background:var(--brass-tint);border-radius:10px;padding:9px 13px;font-size:14px}
.gpanel summary{cursor:pointer;font-weight:700;list-style:none}
.gpanel summary::-webkit-details-marker{display:none}
.gpanel .gp-body{margin-top:8px;overflow-wrap:anywhere}
.diff-bad{color:var(--clay);font-weight:700;text-decoration:underline wavy}
.q-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.sum-score{text-align:center;padding:8px 0 2px}
.sum-score .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pine)}

/* 片語／題庫 */
.wordrow{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line-soft);flex-wrap:wrap}
.wordrow .w{font-family:var(--serif);font-weight:700;font-size:16.5px}
.wordrow .m{color:var(--ink-soft);font-size:14px;flex:1}
input.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:var(--card);color:var(--ink);margin-bottom:10px}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--card);color:var(--ink);resize:vertical}
.imp-msg{border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
.imp-msg.ok{background:var(--ok-tint);color:var(--ok)}
.imp-msg.err{background:var(--clay-tint);color:var(--clay)}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;background:var(--card)}
details summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--ink-soft)}
details[open] summary{margin-bottom:10px}
.bank-row{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line-soft);font-size:14px}
.bank-row .es{font-family:var(--serif);color:var(--ink-soft)}
.warn{color:var(--clay);font-size:12px;font-weight:700}
.cs-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;min-height:0;border-radius:999px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;cursor:pointer}
.cs-chip:hover{border-color:var(--pine-mid)}
.cs-chip-ic{font-size:13px;line-height:1}
.cs-chip.cs-ok{background:var(--pine-tint);border-color:var(--pine-mid);color:var(--pine-deep)}
.cs-chip.cs-fail{background:var(--clay-tint);border-color:var(--clay-line);color:var(--clay)}
.cs-chip.cs-busy{background:var(--brass-tint);border-color:var(--brass-line);color:var(--brass)}
.cs-chip.cs-offline,.cs-chip.cs-out{color:var(--ink-faint)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88vw;background:var(--pine-deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:560px){
  .masthead h1{font-size:26px}
  .catrow .nm{width:100px;font-size:13px}
  .q-zh{font-size:21px}
}
@media(max-width:640px){
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-size:16px}
  #app{max-width:100%;padding:14px 14px calc(72px + env(safe-area-inset-bottom))}
  .masthead{gap:8px;margin-bottom:14px}
  .eyebrow{font-size:9px}
  .masthead h1{font-size:22px}
  .voicesel{max-width:120px;font-size:12.5px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#fff;border:none;border-top:1px solid var(--line);border-radius:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));margin-bottom:0;overflow-x:visible}
  .tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:normal}
  .tabs button.on{background:transparent;color:var(--pine-deep)}
  .tabs button .tab-ic{display:block;font-size:20px;line-height:1}
  .tabs button .tab-tx{display:flex;align-items:center;gap:2px;line-height:1.1}
  .tabs button .n{display:none}
  .card{padding:16px;margin-bottom:12px}
  .btn{min-height:48px;font-size:16px}
  .acts .btn,.q-foot .btn{flex:1 1 auto}
  .opt{min-height:48px;padding:13px 14px;font-size:17px}
  .tile{padding:11px 14px;font-size:18px}
}
</style>
</head>

<div id="app">
  <header class="masthead">
    <div>
      <a href="../../index.html" class="btn ghost small" id="homelink" style="margin-bottom:8px">← 首頁</a>
      <div class="eyebrow">ENTRENAMIENTO DE ESPAÑOL</div>
      <h1>西文訓練場</h1>
    </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

</div>

var ES_PACKS = /*ES_PACKS_START*/[{"id":"saludos","title":"自我介紹與寒暄","stage":1,"level":"A1","grammar":["ser/estar","主詞代名詞","hay","疑問詞","數字","tener","llamarse","冠詞","介系詞","固定問候"],"intro":"本包反覆用到的骨架：Soy／Eres／Es＋身分或國籍、Estoy＋狀態、Tengo＋數字＋años，以及 ¿Cómo／Qué／Dónde／De dónde／Cuántos…? 問句。自我介紹只用 Me llamo… 或 Se llama… 這兩個固定句型。","items":[{"id":"saludos-001","scene":"初次見面","zh":"你好，我是安娜。","es":"Hola, soy Ana.","alt":["Hola, me llamo Ana."],"tiles":["Hola","soy","Ana"],"distractors":["eres","es"],"options":[{"es":"Hola, eres Ana.","why":"soy 才是「我是」，eres 是「你是」。"},{"es":"Hola, estoy Ana.","why":"介紹名字用 ser，不用 estar。"},{"es":"Hola, es Ana.","why":"es 是「他／她是」，說自己要用 soy。"}],"chunks":[{"es":"Hola","zh":"你好"},{"es":"soy Ana","zh":"我是安娜（ser 第一人稱）"}],"note":"初次見面最常用 Hola, soy… 或 Me llamo…。","grammar":["結構：Hola（禮貌語）＋soy（動詞，省略主詞 yo）＋Ana（補語，名字）","動詞：soy 是 ser 第一人稱單數現在式；ser 是不規則動詞。","重點：動詞已含人稱，所以主詞 yo 通常省略，不說 yo soy。"],"tags":["ser/estar","主詞代名詞"]},{"id":"saludos-002","scene":"初次見面","zh":"幸會，安娜。","es":"Mucho gusto, Ana.","alt":["Encantado, Ana.","Encantada, Ana."],"tiles":["Mucho","gusto","Ana"],"distractors":["mucha","gustos"],"options":[{"es":"Mucha gusto, Ana.","why":"gusto 是陽性名詞，要用 mucho。"},{"es":"Muchos gusto, Ana.","why":"gusto 是單數，不能加 muchos。"},{"es":"Mucho gusta, Ana.","why":"「幸會」是名詞 gusto，不是動詞 gusta。"}],"chunks":[{"es":"Mucho gusto","zh":"幸會（固定問候）"},{"es":"Ana","zh":"對方名字"}],"note":"Encantado（男）／Encantada（女）是同樣常用的說法。","grammar":["結構：Mucho gusto（禮貌語）＋Ana（稱呼）","用法：初次見面的固定寒暄，字面是「很高興」，男女都能說。","重點：mucho 修飾陽性名詞 gusto，所以用 mucho，不用 mucha。"],"tags":["冠詞","主詞代名詞"]},{"id":"saludos-003","scene":"初次見面","zh":"我叫卡洛斯。","es":"Me llamo Carlos.","alt":["Soy Carlos."],"tiles":["Me","llamo","Carlos"],"distractors":["te","llama"],"options":[{"es":"Me llama Carlos.","why":"自己說名字用 me llamo，不是 me llama。"},{"es":"Llamo Carlos.","why":"少了 me，llamarse 是反身動詞。"},{"es":"Se llamo Carlos.","why":"se 是第三人稱，第一人稱要用 me。"}],"chunks":[{"es":"Me llamo","zh":"我叫（固定句）"},{"es":"Carlos","zh":"名字"}],"note":"Me llamo… 與 Soy… 都自然，前者 -007","scene":"說年齡","zh":"我二十歲。","es":"Tengo veinte años.","alt":["Yo tengo veinte años."],"tiles":["Tengo","veinte","años"],"distractors":["soy","estoy"],"options":[{"es":"Soy veinte años.","why":"西語說年齡用 tener，不用 ser。"},{"es":"Estoy veinte años.","why":"年齡不能用 estar，要用 tener。"},{"es":"Tiene veinte años.","why":"tiene 是「他／她有」，說自己用 tengo。"}],"chunks":[{"es":"Tengo","zh":"我有（tener）"},{"es":"veinte años","zh":"二十歲"}],"note":"年齡一律用 tener＋數字＋años，中文的「是」不能直譯。","grammar":["結構：Tengo（動詞，省略主詞 yo）＋veinte años（受詞，數字＋年齡單位）","動詞：tengo 是 tener 第一人稱單數現在式；yo 形不規則。","重點：數字後的 años 用複數；只有一歲才用單數 un año。"],"tags":["tener","數字"]},{"id":"saludos-008","scene":"問年齡","zh":"你幾歲？","es":"¿Cuántos años tienes?","alt":["¿Qué edad tienes?"],"tiles":["Cuántos","años","tienes"],"distractors":["tengo","eres"],"options":[{"es":"¿Cuántos años eres?","why":"問年齡用 tener，不用 ser。"},{"es":"¿Cuánto años tienes?","why":"años 是複數陽性，要用 cuántos。"},{"es":"¿Cuántos años tengo?","why":"tengo 是「我有」，問對方要用 tienes。"}],"chunks":[{"es":"¿Cuántos años","zh":"幾歲（cuántos 配 años）"},{"es":"tienes?","zh":"你有（tener 第二人稱）"}],"note":"對長輩或陌生人通常不直接問年齡，需要時用 usted tiene。","grammar":["結構：¿Cuántos años（疑問詞＋名詞）＋tienes（動詞，省略主詞 tú）？","動詞：tienes 是 tener 第二人稱單數現在式（e→ie 變化）。","重點：cuántos 要與 años 性數一致（陽性複數）；問陰性複數才用 cuántas。"],"tags":["tener","疑問詞"]},{"id":"saludos-009","scene":"道別","zh":"待會見，巴布羅。","es":"Hasta luego, Pablo.","alt":["Nos vemos luego, Pablo."],"tiles":["Hasta","luego","Pablo"],"distractors":["pronto","adiós"],"options":[{"es":"Hasta luegos, Pablo.","why":"luego 是副詞，不能加 s。"},{"es":"A luego, Pablo.","why":"固定說法是 hasta luego，不是 a luego。"},{"es":"Hasta lugo, Pablo.","why":"拼字錯誤，應為 luego。"}],"chunks":[{"es":"Hasta luego","zh":"待會見（固定道別）"},{"es":"Pablo","zh":"對方名字"}],"note":"同一天內會再見面時用；較久才見面用 Hasta pronto。","grammar":["結構：Hasta luego（固定道別語）＋Pablo（稱呼）","用法：道別用語，字面是「到晚一點」，不久後會再見時說。","重點：hasta 是介系詞「直到」；Hasta mañana 結構相同，後接時間詞。"],"tags":["疑問詞","固定問候"]},{"id":"saludos-010","scene":"確認身分","zh":"對，是我。","es":"Sí, soy yo.","alt":[],"tiles":["Sí", ctors":["cuántos","está"],"options":[{"es":"¿Cuántos es, por favor?","why":"錢是不可數，用 cuánto。"},{"es":"¿Cuánta es, por favor?","why":"問總額固定用 cuánto，不是 cuánta。"},{"es":"¿Cuánto está, por favor?","why":"問總額固定用 es，不是 está。"}],"chunks":[{"es":"¿Cuánto es?","zh":"一共多少錢"},{"es":"por favor","zh":"麻煩了"}],"note":"結帳時問 ¿Cuánto es? 或 ¿Cuánto le debo?。","grammar":["結構：¿Cuánto（疑問詞）＋es（動詞）？＋por favor（禮貌語）","動詞：es 是 ser 第三人稱單數現在式；問總價用 ser。","重點：cuánto 在此是代名詞，固定用陽性單數；疑問詞要有重音。"],"tags":["數字與價格","疑問詞"]},{"id":"cafe-009","scene":"稱讚食物","zh":"謝謝，非常好吃。","es":"Gracias, está muy rico.","alt":["Gracias, está buenísimo."],"tiles":["Gracias","está","muy","rico"],"distractors":["es","ricos"],"options":[{"es":"Gracias, es muy rico.","why":"味道好壞用 estar，不用 ser。"},{"es":"Gracias, está muy ricos.","why":"主詞是單數，形容詞也用單數。"},{"es":"Gracias, estoy muy rico.","why":"estoy 是「我」，描述食物要用 está。"}],"chunks":[{"es":"Gracias","zh":"謝謝"},{"es":"está muy rico","zh":"很好吃（estar＋味道）"}],"note":"rico／buenísimo 都是稱讚食物的口語說法。","grammar":["結構：Gracias（禮貌語）＋está（動詞，省略主詞 él／eso）＋muy rico（副詞＋補語）","動詞：está 是 estar 第三人稱單數；評論味道用 estar。","重點：rico 搭 ser 是「有錢」，搭 estar 才是「好吃」，意思會變。"],"tags":["estar（味道溫度）","por favor"]},{"id":"cafe-010","scene":"問飲食","zh":"有無糖的甜點嗎？","es":"¿Hay postres sin azúcar?","alt":["¿Tienen postres sin azúcar?"],"tiles":["Hay","postres","sin","azúcar"],"distractors":["está","con"],"options":[{"es":"¿Están postres sin azúcar?","why":"問有沒有，用 hay，不用 estar。"},{"es":"¿Hay postres con azúcar?","why":"con 是有糖，無糖要用 sin。"},{"es":"¿Hay postres en azúcar?","why":"「不含」用 sin，不是 en。"}],"chunks":[{"es":"¿Hay postres","zh":"有甜點嗎"},{"es":"sin azúcar?","zh":"不加糖的"}],"note":"有飲食限制時常用 ¿Hay… sin…? 開頭詢問。","grammar":["結構：¿Hay（動詞）＋postres（受詞）＋sin azúcar（介系詞片語）？","動詞：hay 是 haber 的無人稱形式，問「有沒有」。","重點：介系詞 sin 後面的名詞通常不加冠詞：sin azúcar、sin leche。"],"tags":["hay","冠詞"]},{"id":"cafe-011","scene":"甜點","zh":"我要一份巧克力冰淇淋。","es":"Quiero un helado de chocolate.","alt":["Me gustaría un helado de chocolate."],"tiles":["Quiero","un","helado","de","chocola ["結構：Me gustaría（客氣的動詞片語，省略主詞 yo）＋pagar（動詞原形）＋con tarjeta（介系詞片語）＋por favor（禮貌語）","動詞：gustaría 是 gustar 條件式；pagar 是原形，不需變位。","重點：付款方式用 con＋名詞，tarjeta 不加冠詞：con tarjeta。"],"tags":["me gustaría","por favor"]},{"id":"cafe-033","scene":"點餐","zh":"我要魚，但不要醬汁，麻煩了。","es":"Quiero el pescado, pero sin salsa, por favor.","alt":["Me gustaría el pescado sin salsa, por favor."],"tiles":["Quiero","el","pescado","pero","sin","salsa","por","favor"],"distractors":["con","la"],"options":[{"es":"Quiero el pescado, pero con salsa, por favor.","why":"sin 才是「不要」，con 是「加」。"},{"es":"Quiero la pescado, pero sin salsa, por favor.","why":"pescado 是陽性，冠詞用 el。"},{"es":"Quiero el pescado, pero no salsa, por favor.","why":"「不要」用 sin，不是 no。"}],"chunks":[{"es":"Quiero el pescado","zh":"我要魚"},{"es":"pero sin salsa","zh":"但不要醬"},{"es":"por favor","zh":"麻煩了"}],"note":"pero sin… 是修改餐點最常用的句型。","grammar":["結構：Quiero（動詞，省略主詞 yo）＋el pescado（受詞），pero（連接詞）＋sin salsa（介系詞片語）＋por favor（禮貌語）","動詞：quiero 是 querer 第一人稱單數現在式。","重點：pero 表示轉折「但是」；用 y 會失去「要修改」的語氣。"],"tags":["querer","por favor"]},{"id":"cafe-034","scene":"點餐","zh":"我要兩杯咖啡和三份西班牙烘蛋，麻煩了。","es":"Quiero dos cafés y tres tortillas, por favor.","alt":["Dos cafés y tres tortillas, por favor."],"tiles":["Quiero","dos","cafés","y","tres","tortillas","por","favor"],"distractors":["uno","cuatro"],"options":[{"es":"Quiero dos café y tres tortillas, por favor.","why":"數字大於一，名詞要用複數。"},{"es":"Quiero dos cafés y tres tortilla, por favor.","why":"tres 之後 tortilla 要用複數。"},{"es":"Quieres dos cafés y tres tortillas, por favor.","why":"quieres 是「你要」。"}],"chunks":[{"es":"Quiero dos cafés","zh":"我要兩杯咖啡"},{"es":"y tres tortillas","zh":"和三份烘蛋"},{"es":"por favor","zh":"麻煩了"}],"note":"tortilla española 是西班牙馬鈴薯烘蛋。","grammar":["結構：Quiero（動詞，省略主詞 yo）＋dos cafés（受詞）＋y tres tortillas（連接詞＋受詞）＋por favor（禮貌語）","動詞：quiero 是 querer 第一人稱單數現在式。","重點：數字大於一，名詞用複數：cafés 保留重音，tortillas 加 -s。"],"tags":["querer","數字與價格"]},{"id":"cafe-035","scene":"稱讚食物","zh":"全部都很好吃，可以結帳嗎？","es":"Todo está muy rico, ¿me trae la cuenta?","alt":["Todo está muy bueno, ¿me trae la cuenta?"],"tiles":["Todo","está","muy","rico","me","trae","la","cuenta"],"distractors":["es","todos"],"options":[{"es":"Todo es muy rico, ¿me trae la cuenta?","why":"評論當下味道用 estar。"},{"es":"Todo está muy rico, ¿me trae el cuenta?","why":"cuenta 是陰性，冠詞用 la。"},{"es":"Todos está muy rico, ¿me trae la cuenta?","why":"todo 指「全部」，要單數 todo。"}],"chunks":[{"es":"Todo está muy rico","zh":"全部都很好吃"},{"es":"¿me trae la cuenta?","zh":"可以拿帳單給我嗎"}],"note":"先稱讚再要帳單，是很有禮貌的結束方式。","grammar":["結構：Todo（主詞）＋está（動詞）＋muy rico（副詞＋補語），¿me trae（間接受詞＋動詞）＋la cuenta（受詞）？","動詞：está 是 estar、trae 是 traer，皆第三人稱單數現在式。","重點：todo 當主詞是陽性單數「一切」，所以搭配 rico，不寫 ricos。"],"tags":["estar（味道溫度）","冠詞"]},{"id":"cafe-036","scene":"點咖啡","zh":"我要一杯少奶的咖啡，麻煩了。","es":"Quiero un café con poca leche, por favor.","alt":["Un café con poca leche, por favor."],"tiles":["Quiero","un","café","con","poca","leche","por","favor"],"distractors":["una","poco"],"options":[{"es":"Quiero un café con poco leche, por favor.","why":"leche 是陰性，要用 poca。"},{"es":"Quiero una café con poca leche, por favor.","why":"café 是陽性，冠詞用 un。"},{"es":"Quiero un café con pocas leche, por favor.","why":"leche 單數，poca 也用單數。"}],"chunks":[{"es":"Quiero un café","zh":"我要一杯咖啡"},{"es":"con poca leche","zh":"少一點牛奶"},{"es":"por favor","zh":"麻煩了"}],"note":"poco／poca 形容詞要跟名詞性別一致。","grammar":["結構：Quiero（動詞，省略主詞 yo）＋un café（受詞）＋con poca leche（介系詞片語）＋por favor（禮貌語）","動詞：quiero 是 querer 第一人稱單數現在式。","重點：poco 放名詞前表示「少量」；相對詞是 mucho（mucha leche）。"],"tags":["querer","冠詞"]},{"id":"cafe-037","scene":"點飲料","zh":"我想要一杯不加牛奶的熱茶，麻煩了。","es":"Me gustaría un té caliente sin leche, por favor.","alt":["Quiero un té caliente sin leche, por favor."],"tiles":["Me","gustaría","un","té","caliente","sin","leche","por","favor"],"distractors":["con","una"],"options":[{"es":"Me gustaría un té caliente con leche, por favor.","why":"sin 是「不加」，con 是「加」。"},{"es":"Me gustaría una té caliente sin leche, por favor.","why":"té 是陽性，冠詞用 un。"},{ ir 後接地點一定要有介系詞 a，不能像中文直接說「去機場」。"],"tags":["ir","介系詞"]},{"id":"direcciones-002","scene":"聽指路","zh":"一直直走。","es":"Siga todo recto.","alt":["Siga recto."],"tiles":["Siga","todo","recto"],"distractors":["sigue","gire"],"options":[{"es":"Sigue todo recto.","why":"對陌生人用 siga，sigue 是 tú。"},{"es":"Gire todo recto.","why":"直走用 siga，gire 是轉彎。"},{"es":"Siga todo recta.","why":"recto 在這裡是副詞，不變化。"}],"chunks":[{"es":"Siga","zh":"請繼續（usted 命令式）"},{"es":"todo recto","zh":"一直直走"}],"note":"siga 和 gire 先當固定片語記，聽得懂就好。","grammar":["結構：Siga（動詞，省略主詞 usted）＋todo recto（副詞片語）","動詞：siga 是 seguir 對 usted 的命令式，先當固定片語記。","重點：指路用 usted 形的命令式，語氣禮貌；todo recto 是一直往前。"],"tags":["命令式固定片語","方位詞"]},{"id":"direcciones-003","scene":"指路","zh":"那裡很遠。","es":"Está muy lejos.","alt":["Está bastante lejos."],"tiles":["Está","muy","lejos"],"distractors":["es","cerca"],"options":[{"es":"Es muy lejos.","why":"位置用 estar，不用 ser。"},{"es":"Está muy lejo.","why":"lejos 是副詞，不能去掉 s。"},{"es":"Está muy cerca.","why":"cerca 是「近」，與原意相反。"}],"chunks":[{"es":"Está","zh":"它在"},{"es":"muy lejos","zh":"很遠"}],"note":"後面加 de＋地點：Está lejos del centro。","grammar":["結構：Está（動詞，省略主詞 él／ella／eso）＋muy lejos（副詞片語）","動詞：está 是 estar 第三人稱單數；位置、距離用 estar。","重點：lejos 是副詞，不隨性數變化，不寫 lejas；形容詞才會變。"],"tags":["estar + 地點","介系詞"]},{"id":"direcciones-004","scene":"路上","zh":"附近有銀行嗎？","es":"¿Hay un banco cerca?","alt":["¿Hay algún banco por aquí?"],"tiles":["Hay","un","banco","cerca"],"distractors":["está","una"],"options":[{"es":"¿Está un banco cerca?","why":"問「有沒有」用 hay，不用 estar。"},{"es":"¿Hay una banco cerca?","why":"banco 是陽性，冠詞用 un。"},{"es":"¿Hay un banco lejos?","why":"問附近要用 cerca，lejos 是「遠」。"}],"chunks":[{"es":"¿Hay un banco","zh":"有銀行嗎"},{"es":"cerca?","zh":"附近"}],"note":"hay 用來問「有沒有」，estar 才是問「在哪裡」。","grammar":["結構：¿Hay（動詞）＋un banco（受詞）＋cerca（副詞）？","動詞：hay 是 haber 的無人稱形式，問「有沒有」。","重點：cerca 單獨用是「附近」；後面接地點才加 de：cerca del banco。"],"tags":["hay","介系詞"]},{"id":"direcciones-005","scene":"車站","zh":"車站在哪裡？","es":"¿Dónde está la estación?","alt":["Perd /* ── 儲存 ── */
function defaults(){ return {srs:{},history:[],settings:{mode:'options',strictAccent:true,voice:'',rate:1},meta:{created:today()}}; }
/* 補齊欄位（load、手動匯入、雲端合併、訪客併入共用） */
function normStore(s){
  var d = defaults();
  if(!s.srs || typeof s.srs!=='object' || Array.isArray(s.srs)) s.srs = d.srs;
  if(!Array.isArray(s.history)) s.history = [];
  s.settings = Object.assign({}, d.settings, (s.settings && typeof s.settings==='object') ? s.settings : {});
  if(MODE_KEYS.indexOf(s.settings.mode)<0) s.settings.mode = 'options';
  if(RATES.indexOf(s.settings.rate)<0) s.settings.rate = 1;
  s.meta = Object.assign({}, d.meta, (s.meta && typeof s.meta==='object') ? s.meta : {});
  return s;
}
function load(){
  try{
    var s = JSON.parse(localStorage.getItem(storeKeyFor(storeOwner)));
    if(!s || typeof s!=='object') return defaults();
    return normStore(s);
  }catch(e){ return defaults(); }
}
var store = load();
function save(){
  try{ if(store.history.length>5000) store.history = store.history.slice(-5000); localStorage.setItem(storeKeyFor(storeOwner), JSON.stringify(store)); }catch(e){}
  if(typeof gdSchedulePush==='function') gdSchedulePush();
}
/* === MERGESTORE_BEGIN ===
   合併（手動匯入、雲端 pull、訪客併入共用；冪等：重複併入同一份不會膨脹）。
   - srs：每題取「last 較新」者；last 相同取 n（作答次數）較多者；再相同取 iv 較大者；勝者的 n／wrong 另取兩邊最大值。
   - history：以 (d,id,mode,ok) 為鍵、逐鍵取兩邊出現次數的最大值（保留同日同題的多次作答，又不會因重複匯入膨脹），
     依日期穩定排序，上限 5000。
   - settings（作答模式／語音／語速）屬裝置偏好，一律保留本機；meta.created 取較早者。 */
function srsIncomingWins(r, l){
  var rl=String(r.last||''), ll=String(l.last||'');
  if(rl!==ll) return rl>ll;
  var rn=r.n||0, ln=l.n||0;
  if(rn!==ln) return rn>ln;
  return (r.iv||0)>(l.iv||0);
}
function mergeStore(local, incoming){
  normStore(local);
  var inc = (incoming && typeof incoming==='object') ? incoming : {};
  var addSrs=0, addHist=0;
  if(inc.srs && typeof inc.srs==='object' && !Array.isArray(inc.srs)){
    Object.keys(inc.srs).forEach(function(id){
      var r=inc.srs[id], l=local.srs[id];
      if(!r || typeof r!=='object' || typeof r.due!=='string') return;
      if(!l || typeof l!=='object'){ local.srs[id]=r; addSrs++; return; }
      var win = srsIncomingWins(r,l) ? r : l;
      var merged = Object.assign({}, win, {n:Math.max(r.n||0,l.n||0), wrong:Math.max(r.wrong||0,l.wrong||0)});
      if(JSON.stringify(merged)!==JSON.stringify(l)){ local.srs[id]=merged; addSrs++; }
    });
  }
  if(Array.isArray(inc.history)){
    var key=function(h){ return h.d+'|'+h.id+'|'+h.mode+'|'+(h.ok?1:0); };
    var lc={}, ic={};
    local.history.forEach(function(h){ if(!h) return; var k=key(h); lc[k]=(lc[k]||0)+1; });
    inc.history.forEach(function(h){
      if(!h || typeof h.d!=='string' || typeof h.id!=='string') return;
      var k=key(h); ic[k]=(ic[k]||0)+1;
      if(ic[k]>(lc[k]||0)){ local.history.push({d:h.d,id:h.id,mode:h.mode,ok:!!h.ok}); addHist++; }
    });
    if(addHist){
      local.history.sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:0; });
      if(local.history.length>5000) local.history = local.history.slice(-5000);
    }
  }
  if(inc.meta && typeof inc.meta.created==='string' && inc.meta.created<local.meta.created) local.meta.created=inc.meta.created;
  return {srs:addSrs, hist:addHist};
}
/* === MERGESTORE_END === */

/* ── SRS ── */
function isDue(it){ var s=store.srs[it.id]; return !!s && s.due<=today(); }
function isSeen(it){ return !!store.srs[it.id]; }
function isMastered(it){ var s=store.srs[it.id]; return !!s && s.iv>=MASTER_IV; }
function dueList(list){ return list.filter(isDue); }
function record(q,ok,mode){
  var id=q.it.id, t=today();
  q.prev = store.srs[id] ? JSON.stringify(store.srs[id]) : null;
  var s = store.srs[id] ? JSON.parse(q.prev) : {iv:0,due:t,n:0,wrong:0,last:t};
  s.n = (s.n||0)+1;
  if(ok){ var idx=IV.indexOf(s.iv); s.iv = (s.iv>0 && idx<0) ? IV[IV.length-1] : (idx<0 ? IV[0] : IV[Math.min(idx+1,IV.length-1)]); }
  else { s.iv = IV[0]; s.wrong = (s.wrong||0)+1; }
  s.due = addDays(t,s.iv); s.last = t;
  store.srs[id]=s;
  store.history.push({d:t,id:id,mode:mode,ok:!!ok});
  save();
}
function undoRecord(q){
  if(q.prev===null || q.prev===undefined) delete store.srs[q.it.id]; else store.srs[q.it.id]=JSON.parse(q.prev);
  store.history.pop();
}
function pickRound(list,n,dueOnly,early){
  var t=today(), due=[], unseen=[], rest=[];
  list.forEach(function(it){ var s=store.srs[it.id]; if(!s) unseen.push(it); else if(s.due<=t) due.push(it); else rest.push(it); });
  var byDue=function(a,b){ return store.srs[a.id].due<store.srs[b.id].due?-1:1; };
  due.sort(byDue); rest.sort(byDue);
  var pick;
  if(dueOnly) pick = due.slice(0,n);
  else if(early) pick = rest.slice(0,n);
  else pick = due.concat(shuffle(unseen), rest).slice(0,n);
  return shuffle(pick);
}
function streak(){
  var set={}; store.history.forEach(function(h){ set[h.d]=1; });
  var d=today(), n=0;
  if(!set[d]) d=addDays(d,-1);
  while(set[d]){ n++; d=addDays(d,-1); }
  return n;
}

var SPEECH_OK = (typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined');
var _voices=[], _noEs=false, _toastTimer=null;
function loadVoices(){ try{ _voices = speechSynthesis.getVoices()||[]; }catch(e){ _voices=[]; } }
function esVoices(){ return _voices.filter(function(v){ return /^es-/i.test(v.lang); }); }
function onVoicesReady(){ loadVoices(); fillVoiceSel(); }
if(SPEECH_OK){
  loadVoices();
  if(typeof speechSynthesis.addEventListener==='function') speechSynthesis.addEventListener('voiceschanged', onVoicesReady);
  else speechSynthesis.onvoiceschanged = onVoicesReady;
}
function showToast(msg){
  var t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(_toastTimer); _toastTimer=setTimeout(function(){ t.style.opacity='0'; },3600);
}
function fillVoiceSel(){
  var sel=document.getElementById('voicesel'); if(!sel) return;
  var list = SPEECH_OK ? esVoices() : [];
  _noEs = SPEECH_OK && !list.length;
  if(!list.length){ sel.style.display='none'; sel.innerHTML=''; return; }
  var cur = store.settings.voice||'';
  var short = function(n){ return n.replace(/^Microsoft\s+/i,'').replace(/\s*-\s*(Spanish.*|Espa[nñ]ol.*)$/i,'').trim(); };
  var groups={}; list.forEach(function(v){ (groups[v.lang]=groups[v.lang]||[]).push(v); });
  var html='<option value="">自動（推薦）</option>';
  Object.keys(groups).sort().forEach(function(lang){
    html+='<optgroup label="'+esc(lang)+'">';
    groups[lang].forEach(function(v){ html+='<option value="'+esc(v.name)+'"'+(cur===v.name?' selected':'')+'>'+esc(short(v.name))+'</option>'; });
    html+='</optgroup>';
  });
  sel.innerHTML=html; sel.style.display=''; sel.value = cur;
  if(sel.value!==cur) sel.value='';
}
function scoreVoice(v){
  var s=0;
  if(/Natural/i.test(v.name)) s+=100; if(/Neural/i.test(v.name)) s+=80; if(/Google/i.test(v.name)) s+=60;
  if(/Online/i.test(v.name)) s+=20; if(/Desktop/i.test(v.name)) s-=50; if(v.localService===false) s+=10;
  if(v.lang==='es-ES') s+=30;
  return s;
}
function pickVoice(){
  if(!_voices.length) loadVoices();
  var list=esVoices(); if(!list.length) return null;
  var chosen=store.settings.voice;
  if(chosen){ for(var i=0;i<list.length;i++) if(list[i].name===chosen) return list[i]; }
  return list.slice().sort(function(a,b){ return scoreVoice(b)-scoreVoice(a); })[0];
}
function speak(text){
  if(!SPEECH_OK || !text) return;
  if(!_voices.length) loadVoices();
  if(!esVoices().length){
    _noEs=true;
    var shown=false; try{ shown=!!localStorage.getItem(TOAST_KEY); localStorage.setItem(TOAST_KEY,'1'); }catch(e){}
    if(!shown) showToast('此裝置沒有西班牙文語音，發音可能不準，可到系統設定安裝');
  }
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text));
    u.lang='es-ES'; u.rate=store.settings.rate||1;
    var v=pickVoice();
    if(v){ try{ u.voice=v; u.lang=v.lang; }catch(e){} }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ── 練習流程 ── */
function startSession(origin,kind,packId){
  var list = (packId && packId!=='*') ? ITEMS.filter(function(i){ return i._pack===packId; }) : ITEMS;
  var round = pickRound(list,ROUND,kind==='due',kind==='early');
  if(!round.length){ showToast('沒有可練習的題目'); return; }
  ui.sess = {origin:origin,kind:kind,packId:packId,list:round,idx:0,results:[],q:null};
  ui.sess.q = makeQ(round[0]);
  ui.tab = origin; wantTop=true; render();
}
function makeQ(it){
  var mode = store.settings.mode, q={it:it,mode:mode,answered:false,ok:null,prev:null,picked:null,input:'',ans:[],userText:''};
  if(mode==='options'){
    q.choices = shuffle([{es:it.es,ok:true}].concat((it.options||[]).map(function(o){ return {es:o.es,why:o.why,ok:false}; })));
  } else if(mode==='tiles'){
    q.pool = shuffle(it._tiles.concat(it.distractors||[]).map(function(w,i){ return {w:w,i:i}; }));
  }
  return q;
}
function finishAnswer(q,ok){
  q.answered=true; q.ok=ok;
  record(q,ok,q.mode);
  ui.sess.results[ui.sess.idx]=ok;
}
function rSession(){
  var s=ui.sess;
  if(s.idx>=s.list.length) return rSummary();
  var q=s.q, it=q.it, pc=Math.round(s.idx/s.list.length*100);
  var h = '<div class="card"><div class="q-head"><span>第 '+(s.idx+1)+' / '+s.list.length+' 題 · '+esc((MODES.filter(function(m){return m.k===q.mode;})[0]||{}).n)+'</span><button class="btn ghost small" data-act="quit">結束</button></div>'+
    '<div class="prog"><i style="width:'+pc+'%"></i></div>'+
    '<div class="q-scene">'+esc(it.scene)+'</div>'+
    '<div class="q-zh"><span>'+esc(it.zh)+'</span>'+(q.answered?'<button class="speakbtn" data-act="speakItem" aria-label="播放發音">🔊</button>':'')+'</div>';
  if(q.mode==='options') h+=bOptions(q);
  else if(q.mode==='tiles') h+=bTiles(q);
  else h+=bTyping(q);
  if(q.answered) h+=bFeedback(q);
  return h+'</div>';
}
function bOptions(q){
  return '<div class="opts">'+q.choices.map(function(c,i){
    var cls='opt';
    if(q.answered){ if(c.ok) cls+=' correct'; else if(q.picked===i) cls+=' wrong'; else cls+=' dim'; }
    return '<button class="'+cls+'" data-act="optPick" data-i="'+i+'"'+(q.answered?' disabled':'')+'><span class="abc">'+'ABCD'.charAt(i)+'</span><span>'+esc(c.es)+'</span></button>';
  }).join('')+'</div>';
}
function bTiles(q){
  var usedSet={}; q.ans.forEach(function(i){ usedSet[i]=1; });
  var cls = q.answered ? (q.ok?' ok':' bad') : '';
  var ansH = q.ans.length ? q.ans.map(function(pi){ var t=q.pool[pi]; return '<button class="tile" data-act="tileBack" data-i="'+pi+'"'+(q.answered?' disabled':'')+'>'+esc(t.w)+'</button>'; }).join('') : '<span class="hint-empty">點下方詞塊，依序排成句子</span>';
  var poolH = q.pool.map(function(t,pi){ return '<button class="tile'+(usedSet[pi]?' used':'')+'" data-act="tilePick" data-i="'+pi+'"'+((q.answered||usedSet[pi])?' disabled':'')+'>'+esc(t.w)+'</button>'; }).join('');
  return '<div class="ansrow'+cls+'" aria-label="答案列">'+ansH+'</div><div class="pool">'+poolH+'</div>'+
    (q.answered?'':'<div class="q-foot"><button class="btn ghost" data-act="tileClear"'+(q.ans.length?'':' disabled')+'>清除</button><button class="btn primary" data-act="tileSubmit"'+(q.ans.length?'':' disabled')+'>送出</button></div>');
}
function bTyping(q){
  var strict=store.settings.strictAccent;
  return '<input type="text" id="typein" class="typein" data-act="typeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入西班牙文…" value="'+esc(q.input)+'"'+(q.answered?' disabled':'')+'>'+
    '<div class="typeopts"><button class="fchip '+(strict?'on':'')+'" data-act="toggleAccent">重音必須正確：'+(strict?'開':'關')+'</button><span class="faint">不必加標點，大小寫不計</span></div>'+
    (q.answered?'':'<div class="q-foot"><button class="btn primary" data-act="typeSubmit">送出</button></div>');
}
function diffHtml(userText,it){
  var target={}, st=store.settings.strictAccent;
  [it.es].concat(it.alt||[]).forEach(function(a){ toks(a).forEach(function(w){ target[norm(w,st)]=1; }); });
  return toks(userText).map(function(w){ return target[norm(w,store.settings.strictAccent)] ? esc(w) : '<span class="diff-bad">'+esc(w)+'</span>'; }).join(' ');
}
function optExplain(q){
  var it=q.it, opts=it.options||[];
  var pickedEs = (q.mode==='options' && q.picked!==null && q.choices[q.picked] && !q.choices[q.picked].ok) ? q.choices[q.picked].es : null;
  var rows=[{es:it.es,why:'',ok:true}].concat(opts.map(function(o){ return {es:o.es,why:o.why,ok:false}; }));
  if(rows.length<2) return '';
  return '<div class="lbl" style="margin:8px 0 2px">各選項解析</div><ul class="optexp">'+rows.map(function(r){
    var cls = r.ok?'right':(pickedEs!==null && r.es===pickedEs?'picked':'');
    var mark = r.ok?'✓':(cls==='picked'?'✗':'·');
    return '<li class="'+cls+'"><div class="oe-es"><span class="oe-mark">'+mark+'</span>'+esc(r.es)+(cls==='picked'?' <span class="faint" style="font-size:12.5px;font-weight:400">（你選的）</span>':'')+'</div>'+
      (r.ok?'<div class="oe-why">正確答案</div>':(r.why?'<div class="oe-why">'+esc(r.why)+'</div>':''))+'</li>';
  }).join('')+'</ul>';
}
function bFeedback(q){
  var it=q.it, h='<div class="fb"><div class="verdict '+(q.ok?'ok':'no')+'">'+(q.ok?'✓ 答對了':'✗ 再看一次')+(q.override?'（手動改判）':'')+'</div>';
  if(q.mode==='typing' && !q.ok && q.userText) h+='<div class="muted" style="margin-bottom:6px">你的答案：'+diffHtml(q.userText,it)+'</div>';
  if(q.mode==='tiles' && !q.ok) h+='<div class="muted" style="margin-bottom:6px">你的排列：'+esc(q.userText)+'</div>';
  h+=optExplain(q);
  h+='<div class="lbl" style="margin:8px 0 2px">標準答案</div><div class="stdans"><span>'+esc(it.es)+'</span><button class="speakbtn" data-act="speakItem" aria-label="播放發音">🔊</button></div>';
  if(it.alt && it.alt.length) h+='<div class="faint" style="font-size:13px;margin-top:8px">其他說法</div><ul class="altlist">'+it.alt.map(function(a){ return '<li>'+esc(a)+'</li>'; }).join('')+'</ul>';
  if(it.chunks && it.chunks.length) h+='<div class="chunks"><div class="h">ESPAÑOL</div><div class="h">中文</div>'+it.chunks.map(function(c){ return '<div class="es">'+esc(c.es)+'</div><div>'+esc(c.zh)+'</div>'; }).join('')+'</div>';
  if(it.grammar && it.grammar.length) h+='<div class="grammar">'+it.grammar.map(function(g){
    g=String(g); var m=g.match(/^([^:：]{1,12})[:：]s*([sS]*)$/);
    return m ? '<div><span class="gtag">'+esc(m[1])+'</span>'+esc(m[2])+'</div>' : '<div>'+esc(g)+'</div>';
  }).join('')+'</div>';
  if(it.note) h+='<div class="note">💡 '+esc(it.note)+'</div>';
  var last = ui.sess.idx>=ui.sess.list.length-1;
  h+='<div class="q-foot">'+((q.mode==='typing'&&!q.ok)?'<button class="btn ghost" data-act="override">其實算對</button>':'')+'<button class="btn primary" data-act="next">'+(last?'看結果':'下一題')+'</button></div></div>';
  return h;
}
function rSummary(){
  var s=ui.sess, ok=s.results.filter(Boolean).length, n=s.list.length;
  var wrong = s.list.filter(function(it,i){ return !s.results[i]; });
  var h='<div class="card"><div class="sum-score"><div class="big">'+ok+' / '+n+'</div><div class="muted">本輪答對</div></div>';
  if(wrong.length) h+='<div class="lbl" style="margin-top:14px">需要加強</div>'+wrong.map(function(it){ return '<div class="wordrow"><span class="w">'+esc(it.es)+'</span><span class="m">'+esc(it.zh)+'</span><button class="speakbtn" data-act="speak" data-t="'+esc(it.es)+'">🔊</button></div>'; }).join('');
  h+='<div class="acts"><button class="btn primary" data-act="again">再來一輪</button><button class="btn ghost" data-act="quit">回到列表</button><button class="btn ghost" data-act="goHome">回總覽</button></div></div>';
  return h;
}

/* ── 片語 ── */
function chunkList(){
  var map={}, out=[];
  ITEMS.forEach(function(it){ (it.chunks||[]).forEach(function(c){
    var k=norm(c.es,true); if(!k||map[k]) return;
    map[k]=1; out.push({es:c.es,zh:c.zh,k:k});
  }); });
  out.sort(function(a,b){ return a.k.localeCompare(b.k,'es'); });
  return out;
}
function vocabRows(){
  var q=norm(ui.vq,false), list=chunkList();
  if(q) list=list.filter(function(c){ return norm(c.es,false).indexOf(q)>=0 || String(c.zh).toLowerCase().indexOf(ui.vq.trim().toLowerCase())>=0; });
  var shown=list.slice(0,300);
  if(!shown.length) return '<div class="empty">沒有符合的片語</div>';
  return shown.map(function(c){ return '<div class="wordrow"><span class="w">'+esc(c.es)+'</span><span class="m">'+esc(c.zh)+'</span><button class="speakbtn" data-act="speak" data-t="'+esc(c.es)+'" aria-label="播放發音">🔊</button></div>'; }).join('')+
    (list.length>shown.length?'<div class="faint" style="padding:10px 2px;font-size:13px">僅顯示前 300 筆（共 '+list.length+'），請用關鍵字縮小範圍。</div>':'');
}
function rVocab(){
  if(!ITEMS.length) return noData();
  return '<div class="card"><div class="lbl">片語清單（查閱用，不計入複習）</div>'+
    '<input type="search" class="search" id="vq" data-act="vfilter" placeholder="關鍵字（西文或中文）" value="'+esc(ui.vq)+'">'+
    '<div id="vlist">'+vocabRows()+'</div></div>';
}

function mergeImport(raw){
  var d; try{ d=JSON.parse(raw); }catch(e){ return {ok:false,text:'不是有效的 JSON。'}; }
  if(!d || typeof d!=='object' || (!d.srs && !Array.isArray(d.history))) return {ok:false,text:'格式不符：找不到 srs 或 history。'};
  var r = mergeStore(store, d);
  save();
  return {ok:true,text:'匯入完成：更新 '+r.srs+' 筆進度、新增 '+r.hist+' 筆作答紀錄。'};
}

/* ── Token provider：Android bridge 路 ──
   契約：login(id)、requestToken(id) 非同步透過 window.__androidAuthCallback(id, result) 回呼，
   result（物件或 JSON 字串皆可）為 {ok:true, accessToken, expiresAt} 或 {ok:false, error, message}；
   isSignedIn() 為同步回傳 boolean；logout() 同步無回呼。 */
function gdHasAndroidBridge(){
  return typeof window!=='undefined' && typeof window.AndroidAuth==='object' && typeof window.AndroidAuth.requestToken==='function';
}
const _gdAndroidCallbacks = {};
if(typeof window!=='undefined'){
  window.__androidAuthCallback = function(id, result){
    const cb = _gdAndroidCallbacks[id];
    if(cb) cb(result);
  };
}
let _gdAndroidSeq = 0;
function gdAndroidCall(method){
  return new Promise((resolve, reject)=>{
    const id = 'gd_'+Date.now().toString(36)+'_'+(++_gdAndroidSeq);
    let done = false;
    const timer = setTimeout(()=>{
      if(done) return;
      done = true;
      delete _gdAndroidCallbacks[id];
      reject(new Error('android bridge timeout: '+method));
    }, 30000);
    _gdAndroidCallbacks[id] = function(result){
      if(done) return;
      done = true;
      clearTimeout(timer);
      delete _gdAndroidCallbacks[id];
      let parsed = result;
      if(typeof result==='string'){
        try{ parsed = JSON.parse(result); }catch(e){ parsed = {ok:false, error:'parse_error', message:result}; }
      }
      resolve(parsed);
    };
    try{
      window.AndroidAuth[method](id);
    }catch(e){
      if(done) return;
      done = true;
      clearTimeout(timer);
      delete _gdAndroidCallbacks[id];
      reject(e);
    }
  });
}
async function gdGetTokenAndroid(opts){
  try{
    let signedIn = false;
    try{ signedIn = !!(window.AndroidAuth && window.AndroidAuth.isSignedIn()); }catch(e){ signedIn = false; }
    if(!signedIn){
      if(!opts.interactive) return {ok:false, error:'not_signed_in'};
      const r = await gdAndroidCall('login');
      if(!r || !r.ok) return {ok:false, error:(r&&r.error)||'login_failed', message:r&&r.message};
      // AppAuth 回傳毫秒，統一轉秒與瀏覽器路一致
      if(typeof r.expiresAt==='number') r.expiresAt = Math.floor(r.expiresAt/1000);
      return r;
    }
    const r = await gdAndroidCall('requestToken');
    if(!r || !r.ok) return {ok:false, error:(r&&r.error)||'token_failed', message:r&&r.message};
    // AppAuth 回傳毫秒，統一轉秒與瀏覽器路一致
    if(typeof r.expiresAt==='number') r.expiresAt = Math.floor(r.expiresAt/1000);
    return r;
  }catch(e){
    gdNoteNetError();
    return {ok:false, error:'exception', message:String((e&&e.message)||e)};
  }
}

/* ── Token provider：瀏覽器 GIS 路 ──
   file:// 開啟時不載入 GIS（OAuth redirect 回不來）。彈窗被擋（popup_closed/popup_failed_to_open）
   回傳 needsInteraction:true，UI 顯示「點此重新連線」，使用者點擊後帶使用者手勢重試（interactive:true）。 */
let _gdGisReady = null;
function gdLoadGis(){
  if(_gdGisReady) return _gdGisReady;
  _gdGisReady = new Promise((resolve, reject)=>{
    if(typeof location!=='undefined' && location.protocol==='file:'){ reject(new Error('file protocol: GIS unavailable')); return; }
    if(typeof window!=='undefined' && window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    if(typeof document==='undefined'){ reject(new Error('no document')); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('failed to load GIS script'));
    document.head.appendChild(s);
  });
  return _gdGisReady;
}
let _gdTokenClient = null;
function gdEnsureTokenClient(){
  if(_gdTokenClient) return _gdTokenClient;
  _gdTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GD_WEB_CLIENT_ID,
    scope: GD_SCOPES,
    callback: ()=>{},
    error_callback: ()=>{},
  });
  return _gdTokenClient;
}
function gdGetTokenBrowser(opts){
  const cached = GD.session;
  const now = Math.floor(Date.now()/1000);
  if(cached && cached.accessToken && cached.expiresAt && (cached.expiresAt-now) > 120){
    return Promise.resolve({ok:true, accessToken:cached.accessToken, expiresAt:cached.expiresAt});
  }
  return gdLoadGis().then(()=>new Promise((resolve)=>{
    try{
      const client = gdEnsureTokenClient();
      client.callback = (resp)=>{
        if(resp && resp.access_token){
          const expiresIn = parseInt(resp.expires_in,10);
          const expiresAt = Math.floor(Date.now()/1000) + (isNaN(expiresIn)?3600:expiresIn);
          resolve({ok:true, accessToken:resp.access_token, expiresAt:expiresAt});
        }else{
          resolve({ok:false, error:'no_token'});
        }
      };
      client.error_callback = (err)=>{
        const type = err && err.type;
        if(type==='popup_closed' || type==='popup_failed_to_open'){
          resolve({ok:false, needsInteraction:true, error:type});
        }else{
          resolve({ok:false, error:(type||'gis_error')});
        }
      };
      client.requestAccessToken({});
    }catch(e){
      resolve({ok:false, error:'exception', message:String((e&&e.message)||e)});
    }
  })).catch((e)=>({ok:false, error:'gis_load_failed', message:String((e&&e.message)||e)}));
}

/* 拿到 token 後查 email；失敗不影響同步流程（catch 吞掉）。 */
async function gdFetchUserInfo(token){
  try{
    const res = await window.fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers:{ 'Authorization':'Bearer '+token },
    });
    if(res.ok){
      const data = await res.json();
      if(data && data.email) GD.email = data.email;
    }
  }catch(e){ /* 失敗不影響同步流程 */ }
}

/* 統一入口：依環境自動選 Android／瀏覽器路；成功時（瀏覽器路）快取 token 到 GD.session 並存 localStorage。 */
async function gdGetToken(opts){
  opts = opts || {};
  const result = gdHasAndroidBridge() ? await gdGetTokenAndroid(opts) : await gdGetTokenBrowser(opts);
  if(result && result.ok){
    GD.needsInteraction = false;
    if(!gdHasAndroidBridge()){
      GD.session = {accessToken: result.accessToken, expiresAt: result.expiresAt};
      gdSaveSessionMeta();
    }
  }else if(result && result.needsInteraction){
    GD.needsInteraction = true;
  }
  return result;
}
function gdInvalidateToken(){
  if(GD.session){ GD.session = {accessToken:null, expiresAt:0}; gdSaveSessionMeta(); }
}
function gdMarkSignedOut(){
  GD.banner = {text:'Google 連線已失效，請重新登入'};
  if(!gdHasAndroidBridge()){
    GD.session = null;
    gdSaveSessionMeta();
  }
}

/* ── Drive API（純 fetch，v3）──
   任一請求 401 → 清快取 token → 靜默重取一次 → 重試一次 → 仍 401 才視為失敗（登出狀態＋橫幅）。
   404（快取的 fileId 已失效）由呼叫端（gdRead/gdUpdate）個別處理：清 fileId，重新 gdFindFile()。 */
async function gdApiFetch(url, options){
  options = options || {};
  const tok = await gdGetToken({interactive:false});
  if(!tok || !tok.ok){
    if(tok && tok.needsInteraction) GD.needsInteraction = true;
    const err = new Error('no_token'); err.code='no_token'; throw err;
  }
  const headers1 = Object.assign({}, options.headers||{}, {'Authorization':'Bearer '+tok.accessToken});
  let res;
  try{
    res = await window.fetch(url, Object.assign({}, options, {headers:headers1}));
  }catch(e){ gdNoteNetError(); throw e; }
  if(res.status===401){
    gdInvalidateToken();
    const tok2 = await gdGetToken({interactive:false});
    if(!tok2 || !tok2.ok){
      gdMarkSignedOut();
      const err = new Error('unauthorized'); err.code=401; throw err;
    }
    const headers2 = Object.assign({}, options.headers||{}, {'Authorization':'Bearer '+tok2.accessToken});
    try{
      res = await window.fetch(url, Object.assign({}, options, {headers:headers2}));
    }catch(e){ gdNoteNetError(); throw e; }
    if(res.status===401){
      gdMarkSignedOut();
      const err = new Error('unauthorized'); err.code=401; throw err;
    }
  }
  return res;
}
async function gdFindFile(){
  const res = await gdApiFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name='"+GD_FILE_NAME+"'")+'&fields=files(id,modifiedTime)');
  if(!res.ok) throw new Error('find failed '+res.status);
  const data = await res.json();
  const files = (data && data.files) || [];
  if(files.length){
    GD.fileId = files[0].id;
    gdSaveSessionMeta();
    return GD.fileId;
  }
  GD.fileId = null;
  return null;
}
async function gdRead(fileId){
  const res = await gdApiFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?alt=media');
  if(res.status===404){
    GD.fileId = null;
    gdSaveSessionMeta();
    const err = new Error('not_found'); err.code=404; throw err;
  }
  if(!res.ok) throw new Error('read failed '+res.status);
  return await res.json();
}
function gdMakeBody(){
  return { store: store, updated_at: new Date().toISOString() };
}
function gdBuildMultipartBody(metadata, dataObj){
  const boundary = 'gd_boundary_'+Math.random().toString(16).slice(2)+Date.now().toString(16);
  const body = ''
    +'--'+boundary+'\r\n'
    +'Content-Type: application/json; charset=UTF-8\r\n\r\n'
    +JSON.stringify(metadata)+'\r\n'
    +'--'+boundary+'\r\n'
    +'Content-Type: application/json\r\n\r\n'
    +JSON.stringify(dataObj)+'\r\n'
    +'--'+boundary+'--';
  return { body: body, contentType: 'multipart/related; boundary='+boundary };
}
async function gdCreate(bodyObj, useKeepalive){
  const built = gdBuildMultipartBody({name:GD_FILE_NAME, parents:['appDataFolder']}, bodyObj);
  const res = await gdApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method:'POST',
    headers:{'Content-Type':built.contentType},
    body: built.body,
    keepalive: !!useKeepalive,
  });
  if(!res.ok) throw new Error('create failed '+res.status);
  const data = await res.json();
  if(data && data.id){ GD.fileId = data.id; gdSaveSessionMeta(); }
  return data;
}
async function gdCreateFromLocal(){
  const data = await gdCreate(gdMakeBody());
  gdSetStatus('ok');
  return data;
}
async function gdUpdate(fileId, bodyObj, useKeepalive){
  const res = await gdApiFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(fileId)+'?uploadType=media', {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(bodyObj),
    keepalive: !!useKeepalive,
  });
  if(res.status===404){
    GD.fileId = null;
    gdSaveSessionMeta();
    const err = new Error('not_found'); err.code=404; throw err;
  }
  if(!res.ok) throw new Error('update failed '+res.status);
  return true;
}

function gdFmtHM(ts){
  var d = new Date(ts);
  var p = function(n){ return String(n).padStart(2,'0'); };
  return p(d.getHours())+':'+p(d.getMinutes());
}

/* 本機 store 是否有「有意義」的學習紀錄 */
function gdStoreIsMeaningful(s){
  if(!s || typeof s!=='object') return false;
  return Object.keys(s.srs||{}).length>0 || (Array.isArray(s.history) && s.history.length>0);
}

/* 畫面更新：chip 一律更新；完整重繪只在沒有作答中的練習時做（避免打斷作答） */
function gdRenderChip(){
  if(typeof document==='undefined' || !document) return;
  var el = document.getElementById('cs-chip-slot');
  if(el) el.innerHTML = gdChipHtml();
}
function gdRefreshView(){
  if(typeof render!=='function') return;
  if(typeof ui!=='undefined' && ui && ui.sess){ gdRenderChip(); return; }
  render();
}
function gdSetStatus(state){
  GD.syncing = (state==='syncing');
  if(state==='ok' || state==='fail' || state==='offline'){
    GD.lastSyncStatus = state;
    GD.lastSyncAt = Date.now();
    if(state==='fail' && GD.banner && typeof showToast==='function') showToast(GD.banner.text);
  }
  gdRenderChip();
}

function gdHasIdentity(){
  if(gdHasAndroidBridge()){
    try{ return !!(window.AndroidAuth && window.AndroidAuth.isSignedIn()); }catch(e){ return false; }
  }
  return !!GD.email;
}

/* 帳號隔離：確認登入 email，並把使用中的本機紀錄切到該帳號（見 ACCT_BEGIN）。
   取不到 email 就回傳 false——不知道是誰的帳號時一律不同步，避免把別人的本機紀錄推上去。 */
async function gdEnsureOwner(token){
  if(!GD.email && token) await gdFetchUserInfo(token);
  var email = normEmail(GD.email);
  if(!email) return false;
  if(acctSwitch(email)){ acctMaybeAdoptGuest(); gdRefreshView(); }
  return storeOwner===email;
}
/* 下載雲端紀錄並用 mergeStore() 併入本機，再把合併結果推回雲端。
   1) token 取不到／非 200／網路錯誤 → 只顯示失敗，不 merge、不 push，pulledOnce 維持原值。
   2) 有雲端檔案且有 store → 併入本機→save→push。
   3) 無雲端檔案或無 store → 本機有意義才首次上傳建檔；本機也空就什麼都不做。 */
async function gdPullAndMerge(){
  if(GD.syncing) return;
  if(!gdHasIdentity()) return;
  gdSetStatus('syncing');
  try{
    var tok = await gdGetToken({interactive:false});
    if(!tok || !tok.ok){
      if(tok && tok.needsInteraction){ GD.needsInteraction = true; GD.banner={text:'需要重新連線 Google 帳號，請點右上角同步狀態'}; }
      else{ GD.banner = {text:'雲端同步失敗，稍後會自動重試'}; }
      gdSetStatus('fail');
      return;
    }
    if(!(await gdEnsureOwner(tok.accessToken))){
      GD.banner = {text:'無法確認登入的 Google 帳號，已暫停同步（避免不同帳號資料混在一起）'};
      gdSetStatus('fail');
      return;
    }
    var owner = storeOwner;
    var fileId = GD.fileId || await gdFindFile();
    var cloud = null;
    if(fileId){
      try{
        cloud = await gdRead(fileId);
      }catch(e){
        if(e && e.code===404){
          fileId = await gdFindFile();
          if(fileId) cloud = await gdRead(fileId);
        }else{
          throw e;
        }
      }
    }
    if(storeOwner!==owner) throw new Error('owner_changed'); // 拉取途中換了帳號：放棄這次結果
    if(cloud && cloud.store && typeof cloud.store==='object'){
      GD.cloudHadData = true;
      GD.pulledOnce = true;
      mergeStore(store, cloud.store);
      save();
      gdRefreshView();
      await gdPush(false, true /* skipEnsure：token 剛驗證過 */);
    }else{
      GD.pulledOnce = true;
      if(gdStoreIsMeaningful(store)){
        await gdCreate(gdMakeBody());
      }
      gdSetStatus('ok');
    }
  }catch(e){
    if(navigator.onLine===false){ gdSetStatus('offline'); }
    else{ GD.banner={text:'雲端同步失敗'}; gdSetStatus('fail'); }
    // pulledOnce 刻意不變動：非成功時維持原值，push 閘門持續關閉
  }
}

/* push：debounce 4 秒（由 save() 末尾掛勾觸發）；頁面 hidden 時立即 flush（keepalive:true）。
   兩道防呆閘門，順序不可變：
   a) pulledOnce 為 false（本頁尚未成功 pull 過一次）一律直接 return。
   b) 待推 store 不 meaningful、且本頁曾 pull 到非空雲端資料 → 拒推＋警告（防禦縱深）。 */
var _gdPushTimer = null;
function gdSchedulePush(){
  if(!gdHasIdentity()) return;
  clearTimeout(_gdPushTimer);
  _gdPushTimer = setTimeout(function(){ gdPush(false); }, 4000);
}
async function gdPush(useKeepalive, skipEnsure){
  if(!gdHasIdentity()) return;
  if(!GD.pulledOnce){ console.warn('[gd] push blocked: 本頁尚未成功完成一次 pull'); return; }
  if(!storeOwner || storeOwner!==normEmail(GD.email)){ console.warn('[gd] push blocked: 本機紀錄不屬於目前登入的帳號'); return; }
  var owner = storeOwner;
  if(!gdStoreIsMeaningful(store) && GD.cloudHadData){
    GD.banner = {text:'偵測到本機紀錄為空、雲端有資料，已阻止覆蓋——請先點同步狀態拉回雲端紀錄'};
    gdSetStatus('fail');
    return;
  }
  gdSetStatus('syncing');
  try{
    if(!skipEnsure){
      var tok = await gdGetToken({interactive:false});
      if(!tok || !tok.ok){
        if(tok && tok.needsInteraction){ GD.needsInteraction = true; GD.banner={text:'需要重新連線 Google 帳號，請點右上角同步狀態'}; }
        else{ GD.banner={text:'雲端同步失敗，稍後會自動重試'}; }
        gdSetStatus('fail');
        return;
      }
    }
    var fileId = GD.fileId;
    if(!fileId){ fileId = await gdFindFile(); }
    if(storeOwner!==owner){ gdSetStatus('ok'); return; } // 途中換了帳號：不推
    var body = gdMakeBody();
    // 瀏覽器 keepalive body 上限約 64KB；超過門檻就不帶 keepalive（下次前景 pull 會補救）
    var bodyLen = JSON.stringify(body).length;
    var sendKeepalive = useKeepalive && bodyLen <= 60000;
    if(useKeepalive && !sendKeepalive){ console.warn('[gd] body 超過 60KB，略過 keepalive'); }
    if(fileId){
      try{
        await gdUpdate(fileId, body, sendKeepalive);
      }catch(e){
        if(e && e.code===404){ await gdCreate(body, sendKeepalive); }
        else{ throw e; }
      }
    }else{
      await gdCreate(body, sendKeepalive);
    }
    GD.banner = null;
    gdSetStatus('ok');
  }catch(e){
    if(navigator.onLine===false){ gdSetStatus('offline'); }
    else{ GD.banner={text:'雲端同步失敗，稍後會自動重試'}; gdSetStatus('fail'); }
  }
}

/* 被擋彈窗後由使用者點擊 chip 觸發的重新連線（interactive:true）；正常登入／登出仍在首頁。 */
async function gdReconnect(){
  GD.needsInteraction = false;
  GD.banner = null;
  gdSetStatus('syncing');
  try{
    var tok = await gdGetToken({interactive:true});
    if(!tok || !tok.ok){
      GD.needsInteraction = !!(tok && tok.needsInteraction);
      GD.banner = {text: GD.needsInteraction ? '登入視窗被瀏覽器阻擋，請再點一次同步狀態' : '連線失敗，請稍後再試'};
      gdSetStatus('fail');
      return;
    }
    GD.email = null;                       // 以這次登入的帳號為準，重查 email
    await gdFetchUserInfo(tok.accessToken);
    gdSaveSessionMeta();
    if(normEmail(GD.email)){ acctSwitch(GD.email); acctMaybeAdoptGuest(); }
    gdRefreshView();
    await gdPullAndMerge();
  }catch(e){
    GD.banner = {text:'連線失敗，請稍後再試'};
    gdSetStatus('fail');
  }
}

/* masthead 同步狀態 chip（cs-chip 系列 CSS 與英文模組相同） */
function gdChipInfo(){
  if(!gdHasIdentity()) return {cls:'out', ic:'○', text: GD.needsInteraction?'需重新連線':'未登入'};
  if(GD.syncing) return {cls:'busy', ic:'⟳', text:'同步中…'};
  if(navigator.onLine===false || GD.lastSyncStatus==='offline') return {cls:'offline', ic:'📴', text:'離線'};
  if(GD.lastSyncStatus==='fail') return {cls:'fail', ic:'⚠', text:'同步失敗'};
  if(GD.lastSyncStatus==='ok' && GD.lastSyncAt) return {cls:'ok', ic:'☁', text:'已同步 '+gdFmtHM(GD.lastSyncAt)};
  return {cls:'out', ic:'○', text:'待同步'};
}
function gdChipHtml(){
  if(GD.envBlocked) return '';
  var info = gdChipInfo();
  var tip = '同步狀態：'+info.text+(GD.banner?('（'+GD.banner.text+'）'):'')+(gdHasIdentity()?(GD.email?'；帳號 '+GD.email:''):'；請回首頁登入 Google');
  return '<button type="button" class="cs-chip cs-'+info.cls+'" data-act="gdChipClick" title="'+esc(tip)+'"><span class="cs-chip-ic">'+info.ic+'</span><span class="cs-chip-tx">'+esc(info.text)+'</span></button>';
}
function gdChipClick(){
  if(GD.needsInteraction){ gdReconnect(); return; }
  if(!gdHasIdentity()){ if(typeof showToast==='function') showToast('請回首頁登入 Google 帳號，登入後西文進度會自動同步'); return; }
  gdPullAndMerge();
}

/* 啟動流程：絕不阻塞首次渲染，全程 async 背景執行。 */
async function gdInit(){
  gdLoadSessionMeta();
  // 共用 session 的 email 與使用中的本機紀錄不一致（例如在首頁換了帳號）→ 先切過去
  if(acctSwitch(GD.email)) render();
  if(storeOwner && acctMaybeAdoptGuest()) render();
  if(gdHasIdentity()){
    await gdPullAndMerge();
  }
}
/* 首頁殼層（其他分頁）登入／登出／換帳號：重新讀 session，切到對應帳號的本機紀錄 */
function gdOnSessionChanged(){
  var before = normEmail(GD.email);
  GD.session = null; GD.email = null; GD.fileId = null;
  gdLoadSessionMeta();
  if(normEmail(GD.email)===before && storeOwner===before) return;
  GD.banner = null; GD.lastSyncAt = null; GD.lastSyncStatus = null; GD.needsInteraction = false;
  if(acctSwitch(GD.email) && storeOwner) acctMaybeAdoptGuest();
  render();
  if(gdHasIdentity()) gdPullAndMerge();
}
/* === GD_MODULE_END === */

window.addEventListener('online', function(){ gdPullAndMerge(); });
window.addEventListener('offline', function(){ gdSetStatus('offline'); });
window.addEventListener('storage', function(e){ if(e.key===HUB_SESSION_KEY || e.key===null) gdOnSessionChanged(); });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden'){ clearTimeout(_gdPushTimer); gdPush(true); }
});

fillVoiceSel();
render();
gdInit();
})();
</script>
