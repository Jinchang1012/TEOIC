<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>語言學習</title>
<style>
:root{
  --paper:#F5F4EE; --card:#FFFFFF; --line:#E3E1D4; --line-soft:#EDEBDF;
  --ink:#1C2B23; --ink-soft:#5C6B60; --ink-faint:#939C92;
  --pine:#24513B; --pine-deep:#16352A; --pine-tint:#E9F0E9; --pine-mid:#3E7157; --pine-tint-line:#CBDCCB;
  --brass:#A87B24; --brass-tint:#F7F0DC; --brass-line:#E3D5AC;
  --clay:#B0492A; --clay-tint:#F8EAE3; --clay-line:#E5C4B4;
  --radius:14px;
  --sans:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141B17; --card:#1C2621; --line:#2E3B33; --line-soft:#25302A;
    --ink:#E8EDE6; --ink-soft:#A5B2A8; --ink-faint:#74827A;
    --pine:#5FA486; --pine-deep:#7DBE9F; --pine-tint:#1F2E26; --pine-mid:#6DB192; --pine-tint-line:#34493D;
    --brass:#D2A24A; --brass-tint:#2C2616; --brass-line:#5A4A22;
    --clay:#E0805F; --clay-tint:#33211A; --clay-line:#5C382B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.masthead{margin-bottom:20px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--brass);font-weight:700}
h1{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:.01em}
h2{margin:26px 0 10px;font-size:13px;letter-spacing:.12em;color:var(--ink-soft);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.muted{color:var(--ink-soft);font-size:13.5px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;font-size:14.5px;font-weight:700}
.btn.primary{background:var(--pine);color:var(--paper)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink-soft);background:var(--card)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.status{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink-faint);flex:none}
.dot.on{background:var(--pine)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.banner{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--clay-tint);border:1px solid var(--clay-line);color:var(--clay);font-size:13.5px}
.mods{display:grid;gap:12px}
.mod{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mod-main{flex:1;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;min-width:0}
.mod-main:hover{background:var(--pine-tint)}
.flag{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.04em;font-family:var(--serif)}
.mod-name{font-size:17px;font-weight:800}
.mod-sub{font-size:13.5px;color:var(--ink-soft)}
.mod-stat{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.mod-toggle{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border-left:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none}
.mod-toggle input{width:18px;height:18px;accent-color:var(--pine)}
details.hidden-box{margin-top:14px}
details.hidden-box summary{cursor:pointer;color:var(--ink-soft);font-size:13.5px;font-weight:700;padding:6px 0}
details.hidden-box .mods{margin-top:8px}
.last{margin-left:6px;font-size:11.5px;color:var(--brass);font-weight:700}
@media (max-width:420px){ .mod-toggle{flex-direction:column;justify-content:center;padding:0 10px;text-align:center} }
</style>
</head>
<body>
<div id="app">
  <header class="masthead">
    <div class="eyebrow">LANGUAGE LEARNING</div>
    <h1>語言學習</h1>
  </header>
  <section aria-labelledby="h-acct">
    <h2 id="h-acct">帳號連線</h2>
    <div class="card" id="acct"></div>
  </section>
  <section aria-labelledby="h-mods">
    <h2 id="h-mods">語言模組</h2>
    <div class="mods" id="mods"></div>
    <details class="hidden-box" id="hiddenBox" hidden>
      <summary>已隱藏模組</summary>
      <div class="mods" id="hiddenMods"></div>
    </details>
  </section>
</div>
<script src="modules.js"></script>
<script>
(function(){
'use strict';
var HUB_SESSION_KEY = 'langhub_gd_session';
var HUB_KEY = 'langhub_v1';
var GD_WEB_CLIENT_ID = '1130644642-d627g1fmvg10bt3g8sh20nmk0guidc1v.apps.googleusercontent.com';
var GD_SCOPES = 'openid email https://www.googleapis.com/auth/drive.appdata';
var MODULES = Array.isArray(window.LANG_MODULES) ? window.LANG_MODULES : [];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function readJSON(k){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function writeJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* hub 狀態（模組開關、最近使用） */
function loadHub(){
  var h = readJSON(HUB_KEY);
  if(!h || typeof h!=='object') h = {};
  if(!h.enabled || typeof h.enabled!=='object') h.enabled = {};
  return h;
}
function saveHub(h){ writeJSON(HUB_KEY, h); }
function isEnabled(h,id){ return h.enabled[id] !== false; }

/* session（共用登入）：{accessToken, expiresAt(epoch秒), email} */
var session = null;
var banner = '';
var busy = false;

function loadSession(){
  var hub = readJSON(HUB_SESSION_KEY);
  if(!hub || typeof hub!=='object' || (!hub.accessToken && !hub.email)){
    hub = null;
  }
  session = hub;
}
function saveSession(s){ session = s; writeJSON(HUB_SESSION_KEY, s); }
function clearSession(){ session = null; try{ localStorage.removeItem(HUB_SESSION_KEY); }catch(e){} }

/* Android bridge：login(id) 非同步經 __androidAuthCallback(id, result) 回呼 */
function hasAndroid(){ return typeof window.AndroidAuth==='object' && window.AndroidAuth && typeof window.AndroidAuth.login==='function'; }
var cbs = {};
var seq = 0;
window.__androidAuthCallback = function(id, result){ var cb = cbs[id]; if(cb) cb(result); };
function androidLogin(){
  return new Promise(function(resolve, reject){
    var id = 'hub_'+Date.now().toString(36)+'_'+(++seq);
    var done = false;
    var timer = setTimeout(function(){ if(done) return; done = true; delete cbs[id]; reject(new Error('timeout')); }, 30000);
    cbs[id] = function(result){
      if(done) return; done = true; clearTimeout(timer); delete cbs[id];
      var p = result;
      if(typeof result==='string'){ try{ p = JSON.parse(result); }catch(e){ p = {ok:false, error:'parse_error', message:result}; } }
      resolve(p);
    };
    try{ window.AndroidAuth.login(id); }
    catch(e){ if(done) return; done = true; clearTimeout(timer); delete cbs[id]; reject(e); }
  });
}

/* GIS 瀏覽器路（file:// 不載入） */
var gisP = null;
function loadGis(){
  if(gisP) return gisP;
  gisP = new Promise(function(resolve, reject){
    if(location.protocol==='file:'){ gisP = null; reject(new Error('file protocol: GIS unavailable')); return; }
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ gisP = null; reject(new Error('failed to load GIS script')); };
    document.head.appendChild(s);
  });
  return gisP;
}
function browserToken(){
  return loadGis().then(function(){
    return new Promise(function(resolve){
      try{
        var client = window.google.accounts.oauth2.initTokenClient({
          client_id: GD_WEB_CLIENT_ID,
          scope: GD_SCOPES,
          callback: function(resp){
            if(resp && resp.access_token){
              var n = parseInt(resp.expires_in,10);
              resolve({ok:true, accessToken:resp.access_token, expiresAt: Math.floor(Date.now()/1000) + (isNaN(n)?3600:n)});
            }else resolve({ok:false, error:'no_token'});
          },
          error_callback: function(err){
            var t = err && err.type;
            resolve({ok:false, error:t||'gis_error', needsInteraction: (t==='popup_closed' || t==='popup_failed_to_open')});
          }
        });
        client.requestAccessToken({});
      }catch(e){ resolve({ok:false, error:'exception', message:String((e&&e.message)||e)}); }
    });
  });
}
function fetchEmail(token){
  return fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+token}})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ return (d && d.email) || ''; })
    .catch(function(){ return ''; });
}

function login(){
  if(busy) return;
  busy = true; banner = ''; renderAcct();
  var p = hasAndroid() ? androidLogin().then(function(r){
    if(r && r.ok && typeof r.expiresAt==='number') r.expiresAt = Math.floor(r.expiresAt/1000); // AppAuth 毫秒轉秒
    return r;
  }) : browserToken();
  p.then(function(tok){
    if(!tok || !tok.ok){
      banner = tok && tok.needsInteraction ? '登入視窗被瀏覽器阻擋，請再點一次「使用 Google 登入」' : '登入失敗，請稍後再試';
      return null;
    }
    return (tok.email ? Promise.resolve(tok.email) : fetchEmail(tok.accessToken)).then(function(email){
      saveSession({accessToken:tok.accessToken, expiresAt:tok.expiresAt, email: email || undefined});
    });
  }).catch(function(e){
    var msg = String((e&&e.message)||'');
    banner = /timeout/.test(msg) ? '登入逾時，請再試一次' : (/GIS/.test(msg) ? '無法載入 Google 登入元件，請確認網路或改用正式網址開啟' : '登入失敗，請檢查網路後再試');
  }).then(function(){ busy = false; renderAcct(); });
}
function logout(){
  var tok = session && session.accessToken;
  try{ if(hasAndroid() && typeof window.AndroidAuth.logout==='function') window.AndroidAuth.logout(); }catch(e){ banner = '登出時發生錯誤'; }
  try{
    if(!hasAndroid() && tok && window.google && window.google.accounts && window.google.accounts.oauth2){
      window.google.accounts.oauth2.revoke(tok, function(){});
    }
  }catch(e){}
  clearSession();
  renderAcct();
}

function isLoggedIn(){
  if(session && (session.email || session.accessToken)) return true;
  try{ if(hasAndroid() && window.AndroidAuth.isSignedIn && window.AndroidAuth.isSignedIn()) return true; }catch(e){}
  return false;
}

/* 渲染 */
function renderAcct(){
  var on = isLoggedIn();
  var label = on ? ('已連線' + (session && session.email ? '：'+esc(session.email) : '')) : '未連線';
  var html = '<div class="status"><span class="dot'+(on?' on':'')+'"></span><span>'+label+'</span></div>'
    + '<p class="muted">登入後各語言模組可透過 Google Drive 同步進度</p>'
    + '<div class="actions">'
    + '<button type="button" class="btn primary" id="btnLogin"'+(busy?' disabled':'')+'>'+(busy?'連線中…':'使用 Google 登入')+'</button>'
    + '<button type="button" class="btn ghost" id="btnLogout"'+((on&&!busy)?'':' disabled')+'>登出</button>'
    + '</div>';
  if(banner) html += '<div class="banner" role="status">'+esc(banner)+'</div>';
  $('acct').innerHTML = html;
  $('btnLogin').onclick = login;
  $('btnLogout').onclick = logout;
}

function statText(m){
  var d = readJSON(m.storeKey);
  if(!d || typeof d!=='object') return '尚未開始';
  var h = Array.isArray(d.history) ? d.history.length : (d.history && typeof d.history==='object' ? Object.keys(d.history).length : 0);
  var v = (d.vsrs && typeof d.vsrs==='object') ? Object.keys(d.vsrs).length : 0;
  if(!h && !v) return '尚未開始';
  return '練習紀錄 '+h+' 筆・單字卡 '+v+' 張';
}
function modHtml(m,h){
  var on = isEnabled(h,m.id);
  return '<div class="mod" data-id="'+esc(m.id)+'">'
    + '<button type="button" class="mod-main" data-go="'+esc(m.id)+'">'
    +   '<span class="flag" style="background:'+esc(m.accent||'#24513B')+'">'+esc(m.flag||String(m.id).toUpperCase())+'</span>'
    +   '<span style="min-width:0"><span class="mod-name">'+esc(m.name)+'</span>'+(h.lastModule===m.id?'<span class="last">最近使用</span>':'')
    +   '<span class="mod-sub" style="display:block">'+esc(m.subtitle||'')+'</span>'
    +   '<span class="mod-stat" style="display:block">'+esc(statText(m))+'</span></span>'
    + '</button>'
    + '<label class="mod-toggle"><input type="checkbox" data-tog="'+esc(m.id)+'"'+(on?' checked':'')+'>顯示於首頁</label>'
    + '</div>';
}
function renderMods(){
  var h = loadHub();
  var shown = '', hidden = '';
  MODULES.forEach(function(m){ if(isEnabled(h,m.id)) shown += modHtml(m,h); else hidden += modHtml(m,h); });
  $('mods').innerHTML = shown || (MODULES.length ? '<p class="muted">目前沒有顯示中的模組，可由下方「已隱藏模組」重新開啟。</p>' : '<p class="muted">模組登錄表 modules.js 未載入：請透過網址（http:// 或正式網站）開啟本頁，而不是在檔案預覽視窗中檢視。</p>');
  $('hiddenMods').innerHTML = hidden;
  $('hiddenBox').hidden = !hidden;
}
function onClick(e){
  var go = e.target.closest && e.target.closest('[data-go]');
  if(go){
    var id = go.getAttribute('data-go');
    var m = MODULES.filter(function(x){ return x.id===id; })[0];
    if(!m) return;
    var h = loadHub(); h.lastModule = id; saveHub(h);
    location.href = m.path;
  }
}
function onChange(e){
  var t = e.target;
  if(t && t.getAttribute && t.getAttribute('data-tog')){
    var h = loadHub();
    h.enabled[t.getAttribute('data-tog')] = !!t.checked;
    saveHub(h);
    var box = $('hiddenBox'), wasOpen = box.open;
    renderMods();
    if(wasOpen && !box.hidden) box.open = true;
  }
}

loadSession();
renderAcct();
renderMods();
$('mods').addEventListener('click', onClick);
$('hiddenMods').addEventListener('click', onClick);
$('mods').addEventListener('change', onChange);
$('hiddenMods').addEventListener('change', onChange);
window.addEventListener('pageshow', function(){ loadSession(); renderAcct(); renderMods(); });

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', function(){
    try{ navigator.serviceWorker.register('./sw.js').catch(function(){}); }catch(e){}
  });
}
})();
</script>
</body>
</html>
